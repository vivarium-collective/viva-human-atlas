name: Publish read-only workbench

# Build this workspace into a self-contained static SPA and publish it to the
# gh-pages branch at workbench/ (served at
# https://vivarium-collective.github.io/viva-human-atlas/workbench/). A read-only
# mirror of every investigation + study on main, browsable with no server.
# (A legacy /dashboard/ path is kept as a redirect to /workbench/.)
#
# Scaffolded by `vivarium-workbench add-dashboard`. DEPLOY job; it writes
# workbench/ (+ a dashboard/ stub and a 404.html deep-link redirect) on gh-pages.
#
# MANUAL-ONLY (workflow_dispatch), NOT auto-on-push. Unlike a pure-spec
# workspace, viva-human-atlas cannot be built on a clean CI runner:
#   * its registry needs the sibling ../pbg-biomodels (+ copasi/tellurium)
#     process-packages — path deps that don't install cleanly on a runner, so
#     build_core() fails and the registry guard (correctly) refuses to publish;
#   * its HRA viewer packs (studies/*/viz/hra) are generated locally and
#     gitignored, so CI can't reproduce them.
# So an auto-on-push CI publish would only ever fail the guard (red) or ship an
# incomplete bundle. Publish LOCALLY instead — from a venv with the sibling
# ../pbg-* repos + freshly built viewer packs:
#     bash scripts/publish_dashboard.sh reports/published/workbench   # build+guard
#     # then push workbench/ to gh-pages (see the script header / repo README)
# This dispatch entry is kept only for the rare case the runner CAN satisfy the
# deps; the guard still backstops it.

on:
  workflow_dispatch:

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIVARIUM_WORKBENCH_REQUIRE_LOOM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install vivarium-workbench (robust — skip workspace sim-deps)
        # Only vivarium-workbench + this workspace's own package are needed to
        # render composite specs statically. The workspace's sibling
        # process-packages (often relative-path deps) do NOT resolve on a clean
        # runner and are NOT needed for the static build, so install the
        # workspace with --no-deps: a missing sim-dep degrades to an unresolved
        # composite in the dashboard rather than aborting the whole publish.
        run: |
          uv venv
          # This workspace requires vivarium-workbench with `baseline.step`
          # (>= v0.3.33, #745) — its single-Step studies use `baseline.step`
          # instead of wrapper composites. Tracked via @main (which resolves its
          # own deps: process-bigraph, viva-marketplace, …).
          uv pip install \
            "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-workbench.git@main"
          uv pip install -e . --no-deps || echo "workspace has no installable build; composites render from spec only"

      - name: Install the workspace's process-packages (for a REAL registry)
        # viva_human_atlas.core.build_core() imports pbg_biomodels (+ its
        # copasi/tellurium simulator backends) — the registry is EMPTY without
        # them. They're relative-path deps locally, so install them from git on
        # the runner. Best-effort: if this fails, the publish step's registry
        # guard fails the job loudly rather than shipping/clobbering with an
        # empty "None registered" snapshot.
        run: |
          # viva-biomodels is now properly git-installable (its [tool.uv.sources]
          # use git, not local paths — viva-biomodels#24), so a normal WITH-deps
          # install pulls the whole registry graph itself: copasi/tellurium/simbio/
          # viva-superpowers + vivarium-workbench. No --no-deps workaround needed.
          uv pip install \
            "viva-biomodels @ git+https://github.com/vivarium-collective/viva-biomodels.git@main" \
            || echo "sibling process-package install failed — the registry guard will catch an empty build"

      - name: Build read-only workbench snapshot
        run: |
          source .venv/bin/activate
          bash scripts/publish_dashboard.sh reports/published/workbench

      - name: Publish to gh-pages (create the branch if absent)
        run: |
          set -euo pipefail
          if [ ! -f reports/published/workbench/index.html ]; then
            echo "::error::build produced no bundle (no index.html); nothing to publish"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git worktree add --detach /tmp/ghp HEAD
          cd /tmp/ghp
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
          fi
          # Preserve locally-generated HRA viewer packs (studies/*/viz/hra):
          # they are gitignored + built by scripts/build_hra_viewer_pack.py, so
          # a CI build can't regenerate them. Carry any already on gh-pages over
          # into the fresh bundle so a CI republish never drops the viewer links.
          # Look under both workbench/ (new canonical) and the legacy dashboard/.
          for root in workbench dashboard; do
            [ -d "$root/studies" ] || continue
            find "$root/studies" -maxdepth 3 -type d -name hra -path '*/viz/hra' | while read -r pack; do
              rel="${pack#$root/}"
              dest="$GITHUB_WORKSPACE/reports/published/workbench/$rel"
              if [ ! -e "$dest" ]; then
                mkdir -p "$(dirname "$dest")"; cp -R "$pack" "$dest"
                echo "preserved viewer pack from gh-pages:$root/: $rel"
              fi
            done
          done
          rm -rf workbench && mkdir -p workbench
          cp -R "$GITHUB_WORKSPACE/reports/published/workbench/." workbench/
          # Legacy /dashboard/ path → redirect to /workbench/ so old links
          # (README showcase, external bookmarks) keep resolving.
          rm -rf dashboard && mkdir -p dashboard
          cat > dashboard/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>viva-human-atlas</title>
          <meta http-equiv="refresh" content="0; url=../workbench/">
          <link rel="canonical" href="../workbench/">
          <script>location.replace('../workbench/' + location.search + location.hash)</script>
          <a href="../workbench/">viva-human-atlas read-only workbench →</a>
          HTML
          # Root redirect so the bare Pages URL (…/viva-human-atlas/) lands on
          # the app instead of 404ing (the bundle only lives under workbench/).
          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>viva-human-atlas</title>
          <meta http-equiv="refresh" content="0; url=./workbench/">
          <link rel="canonical" href="./workbench/">
          <script>location.replace('./workbench/' + location.search + location.hash)</script>
          <a href="./workbench/">viva-human-atlas read-only workbench →</a>
          HTML
          # Catch-all for DEEP legacy links: the dashboard/index.html stub above
          # only covers the bare /dashboard/ root. GitHub Pages serves 404.html
          # for any path it can't find, so this forwards old deep links like
          # /viva-human-atlas/dashboard/studies/<slug>/viz/atlas/index.html to the
          # matching /workbench/… path (sub-path, query, and hash preserved).
          cat > 404.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Redirecting… — viva-human-atlas</title>
          <meta name="robots" content="noindex">
          <script>
          (function () {
            var OLD = "/viva-human-atlas/dashboard/";
            var NEW = "/viva-human-atlas/workbench/";
            var path = location.pathname;
            if (path.indexOf(OLD) === 0) {
              location.replace(NEW + path.slice(OLD.length) + location.search + location.hash);
            } else {
              location.replace(NEW);
            }
          })();
          </script>
          <p>Redirecting to the <a href="/viva-human-atlas/workbench/">viva-human-atlas read-only workbench</a>…</p>
          HTML
          git add -A
          if git diff --cached --quiet; then
            echo "read-only workbench snapshot unchanged; skipping commit"
          else
            git commit -m "gh-pages: republish read-only workbench (automated, ${GITHUB_SHA::7})"
            git push origin gh-pages
            echo "published read-only workbench to gh-pages:workbench/ (+ dashboard/ + 404 deep-link redirects)"
          fi
