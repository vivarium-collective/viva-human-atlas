[project]
name = "viva-human-atlas"
version = "0.0.0"
description = "HRA / Whole Person Physiome modeling workspace (process-bigraph)"
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=1.8.3",
    "bigraph-schema",
    "requests>=2.31",
    "pyyaml>=6.0",
    # Reused comparison machinery + transitively copasi/tellurium/simbio/biomodels/superpowers/workbench:
    "viva-biomodels",
    # Direct engine deps (also pulled by viva-biomodels, listed for clarity):
    "viva-copasi",
    "viva-tellurium",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

# These sibling process-packages are not on PyPI. Default to GIT sources so a
# fresh clone installs with `uv pip install -e .` and no local sibling checkouts
# (the "clone → hit play" path in docs/REPRODUCIBILITY.md). For LOCAL editable
# dev of a sibling, override per-checkout, e.g.:
#   uv pip install -e ../viva-biomodels -e ../viva-copasi -e ../viva-tellurium
[tool.uv.sources]
viva-biomodels = { git = "https://github.com/vivarium-collective/viva-biomodels.git", branch = "main" }
viva-copasi = { git = "https://github.com/vivarium-collective/viva-copasi.git", branch = "main" }
viva-tellurium = { git = "https://github.com/vivarium-collective/viva-tellurium.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
markers = ["network: hits external services; deselect with -m 'not network'"]
