[project]
name = "viva-human-atlas"
version = "0.0.0"
description = "HRA / Whole Person Physiome modeling workspace (process-bigraph)"
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=1.8.3",
    "bigraph-schema",
    "requests>=2.31",
    "pyyaml>=6.0",
    # Reused comparison machinery + transitively copasi/tellurium/simbio/biomodels/superpowers/workbench:
    "viva-biomodels",
    # Direct engine deps (also pulled by viva-biomodels, listed for clarity):
    "viva-copasi",
    "viva-tellurium",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

# Local editable siblings for development. The pbg-* repos were renamed to viva-*
# in the 2026 rebrand; these paths point at the current sibling checkouts.
# For a clean environment without local siblings, install the same packages from
# git instead, e.g.:
#   uv pip install -e . --no-deps
#   uv pip install "viva-biomodels @ git+https://github.com/vivarium-collective/viva-biomodels"
[tool.uv.sources]
viva-biomodels = { path = "../viva-biomodels", editable = true }
viva-copasi = { path = "../viva-copasi", editable = true }
viva-tellurium = { path = "../viva-tellurium", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
markers = ["network: hits external services; deselect with -m 'not network'"]
