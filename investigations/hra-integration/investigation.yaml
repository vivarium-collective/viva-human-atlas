expert_docs: []
acceptance_criteria:
  - study: hra-reference-organs
    behavior: "The HRA CCF reference-organs endpoint returns a non-empty, Uberon-annotated organ list with per-sex GLB assets."
  - study: hra-cell-types
    behavior: "The HRA CCF cell-type-term-occurences endpoint returns a non-empty, count-sorted Cell Ontology term list."
  - study: hra-anatomical-structures
    behavior: "The HRA CCF ontology-term-occurences endpoint returns a non-empty, count-sorted anatomical-structure term list."
  - study: glucose-biomodel-do
    behavior: "At least one glucose-regulation BioModel is tagged with at least one HRA organ, and the organ->models index is inspectable (not a black box)."
  - study: annotation-organ-matching
    behavior: "The committed annotation catalog (datasets/biomodel_annotation_catalog.json) tags at least 100 corpus models with an HRA organ, and every organ tag traces to a specific CVTerm (curie, qualifier, element) via the BTO->organ crosswalk or a direct Uberon/FMA match — not a black box."
  - study: annotation-recall-gain
    behavior: "annotation_gain.compare_catalogs over the committed name-synonym and annotation catalogs shows annotation-based matching adding at least 50 models and at least 2 whole organs over name-only matching, with a union organ->models index inspectable per-organ (not just an aggregate delta)."
  - study: biomodel-hra-map
    behavior: "The committed corpus DB (datasets/model_hra_map.json) harvests all 1,096 curated BioModels, each with molecular ids + publication link + HRA organ/FTU/cell-type mapping, loads network-free via BiomodelHraMapStep (cache-or-load), and reports measured corpus coverage (89% molecular, 20% Uberon, 10% HRApop) — with the DB downloadable as a registered workspace dataset."
