schema_version: 2
name: human-atlas
created: '2026-07-26'
package_path: viva_human_atlas
observables: []
visualizations: []
simulations: []
datasets:
  - name: biomodel-hra-map
    path: datasets/model_hra_map.json
    sha256: 653fa14a4fb7c6685579c16ba4fcde5cbb32d30bc6f7f06891edad837cdafc33
    claims:
      - 1096 curated BioModels harvested and mapped to the Human Reference Atlas
      - Per model: molecular ids (CHEBI/UniProt/KEGG/GO/Reactome), publication links, organism, and HRA organ/FTU/cell-type mapping
      - Anatomy crosswalked from paper MeSH (via PubMed) + BTO + ASCT+B gene->Uberon; organism + HGNC/Ensembl gene ids added
      - 112 models linked to HRApop measured cell-type populations
  - name: asctb-tables
    path: datasets/asctb_tables.json
    sha256: f7abb7817ec1b84ec08d63e2b2a2df4a23ffb2f2b3abe594e95e077d497c61ef
    claims:
      - All HRA ASCT+B tables (27 organs) harvested into one JSON via the asctb-api
      - Per row: anatomical structures (Uberon), cell types (CL), biomarker genes (HGNC)
      - Provides the gene(HGNC)->Uberon crosswalk that enriches the BioModels->HRA map
references_bib: references/papers.bib
imports:
  viva-biomodels:
    source: https://github.com/vivarium-collective/viva-biomodels.git
    ref: main
    mode: reference
    path: ../viva-biomodels
    package: pbg_biomodels
    description: BioModels fetch + SED-ML parse + multi-simulator comparison
  viva-copasi:
    source: https://github.com/vivarium-collective/viva-copasi.git
    ref: main
    mode: reference
    path: ../viva-copasi
    package: pbg_copasi
    description: COPASI-backed UTC Step
  viva-tellurium:
    source: https://github.com/vivarium-collective/viva-tellurium.git
    ref: main
    mode: reference
    path: ../viva-tellurium
    package: pbg_tellurium
    description: Tellurium / libroadrunner UTC Step
  viva-opencor:
    source: https://github.com/vivarium-collective/viva-opencor.git
    ref: main
    mode: reference
    path: ../viva-opencor
    package: viva_opencor
    description: OpenCOR / CellML UTC Step + Process (libOpenCOR) — runs Physiome models
server:
  enabled: false
