    description: BioModels fetch + SED-ML parse + multi-simulator comparison
  pbg-copasi:
    source: https://github.com/vivarium-collective/pbg-copasi.git
    ref: main
    mode: reference
    path: ../pbg-copasi
    package: pbg_copasi
    description: COPASI-backed UTC Step
  pbg-tellurium:
