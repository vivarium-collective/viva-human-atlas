<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HRA Organ Viewer — model coverage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="3D Human Reference Atlas organ colored by mechanistic-model coverage.">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-2: #1f2630;
      --text: #d6dde3;
      --text-dim: #8a96a3;
      --covered: #4caf78;
      --uncovered: #6b7480;
      --border: #2a313c;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; outline: none; width: 100%; height: 100%; }

    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 8px 14px; display: flex; align-items: center; gap: 14px;
    }
    header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    header h1 .sub { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
    #summary-line { color: var(--text-dim); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }

    #legend {
      position: absolute; top: 52px; left: 14px; z-index: 20;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 12px;
    }
    #legend .legend-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    #legend .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
    #legend .swatch.covered { background: var(--covered); }
    #legend .swatch.uncovered { background: var(--uncovered); }

    #hover-panel {
      position: absolute; bottom: 14px; left: 14px; z-index: 20;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      min-width: 220px; max-width: calc(100% - 28px);
      pointer-events: none;
    }
    #hover-panel[hidden] { display: none; }
    #hover-panel .hp-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    #hover-panel .hp-row { font-size: 11.5px; color: var(--text-dim); margin: 2px 0; }
    #hover-panel .hp-row .num { color: var(--text); font-variant-numeric: tabular-nums; }

    #status {
      position: absolute; top: 52px; right: 14px; z-index: 20;
      color: var(--text-dim); font-size: 11.5px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <h1>HRA Organ Viewer<span class="sub">model coverage</span></h1>
      <div id="summary-line">loading…</div>
    </header>

    <div id="legend">
      <div class="legend-row"><span class="swatch covered"></span><span>covered by a mechanistic model</span></div>
      <div class="legend-row"><span class="swatch uncovered"></span><span>no model coverage</span></div>
    </div>

    <div id="hover-panel" hidden>
      <div class="hp-label" id="hp-label"></div>
      <div class="hp-row" id="hp-uberon"></div>
      <div class="hp-row" id="hp-models"></div>
    </div>

    <div id="status">loading…</div>
  </div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
