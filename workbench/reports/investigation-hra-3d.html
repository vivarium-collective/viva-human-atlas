e", "ftu_coverage_summary"], "outputs": [], "doc": "Store historical states in memory.", "compartments": []}], "stores": [{"name": "state", "type": null, "children": [{"name": "ftu_coverage_summary", "type": null, "children": []}, {"name": "corpus_catalog", "type": null, "children": [{"name": "organ_index", "type": null, "children": []}, {"name": "organ_to_models", "type": null, "children": []}]}]}], "edges": [], "composite": "viva_human_atlas.composites.ftu_coverage_composite.ftu-model-coverage"}, "verdict": "needs_calibration", "verdict_counts": {"passed": 0, "skipped": 0, "failed": 0}, "computed_gate_verdict": {"result": "needs_calibration"}, "run_commands": {"baseline": "vwb run study ftu-model-coverage --steps 1", "variants": [], "simulations": [], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "CTpop -> Topp2000 Islet Parameterization — Beta-Cell Composition Shifts the Glucose Setpoint", "question": "Does binding HRA CTpop islet cell-type composition to the Topp2000\nbeta-cell-mass model (BIOMD0000000341) change the predicted glucose\nregulation -- realizing the RUI -> CTpop -> model parameterization vision\nKaty Boerner / Peter Hunter / SPARC describe, for the pancreatic islet FTU\n`ftu-model-coverage` already found covered?\n", "biological_summary": "`ftu-model-coverage` identified the pancreatic islet as an HRA functional\ntissue unit already covered by curated BioModels (Topp2000, Jiang2007,\nBertram2007) and stubbed (via `ctpop_parameter_stub`) the islet's\nbeta/alpha/delta cell types (CL:0000169/0171/0173) as candidate CTpop\n(Cell Type Populations, Bueckle 2026) parameterization targets, without\nbinding any real count. This study takes that next step for Topp2000\n(BIOMD0000000341, Topp et al. 2000 J Theor Biol): it binds a documented\nHRA-aligned islet beta-cell-fraction (a live CTpop API pull is not\npublicly exposed as JSON as of this writing, so this study uses\ndocumented literature/HRA-ASCT+B composition values instead, cited in\n`ISLET_COMPOSITION` -- beta 54%, alpha 34%, delta 10%, PP/epsilon ~2%,\nper Cabrera et al. 2006 PNAS and Brissova et al. 2005) onto the Topp\nmodel's initial beta-cell mass B, via\n`B_init = b_ref * (beta_fraction / 0.54)` where `b_ref` (37, the model's\nown SBML-declared default initial B) is read out of the model, not\nhardcoded. The Topp model is deliberately built to operate on a DAYS\ntimescale (beta-cell-mass turnover is slow relative to glucose/insulin\nkinetics), so this study runs it out to 4,000 model-time-units (~11\nyears) -- long enough for the model's slow beta-cell-mass compartment to\nreach a new steady state. Running both a healthy islet (54% beta,\nb_init=37, reproducing the model's own default) and a beta-depleted\nislet (30% beta, the T2D-relevant beta-cell loss, b_init~20.6) shows the\ncomposition binding lands on a real mechanistic knife-edge in this model:\nthe healthy islet settles at the model's physiological fixed point\n(glucose ~100 mg/dL, a normal fasting-range value), while the\nbeta-depleted islet crosses Topp2000's bifurcation into the pathological\nfixed point (glucose ~600 mg/dL, severe hyperglycemia, with beta-cell\nmass and insulin both collapsing toward zero) -- exactly the \"mild vs.\nextreme beta-cell loss\" bifurcation behavior the original Topp et al.\n2000 paper describes as its central diabetes-progression finding. So\nbinding CTpop composition to this model doesn't just nudge a number, it\nflips which of the model's two stable regimes the trajectory lands in.\n", "baseline": [{"name": "baseline", "step": "local:viva_human_atlas.ctpop_islet.CtpopIsletParameterizationStep", "params": {"model_id": "BIOMD0000000341", "t_end": 4000.0, "n_points": 200}}], "behavior_tests": [{"name": "healthy_islet_physiological_fixed_point", "gate_class": "acceptance_criterion", "observable": "runs.healthy.{time,B,G,I}", "description": "The healthy islet composition (54% beta, b_init = b_ref = 37) settles\nthe Topp2000 model at its physiological fixed point over 4,000\nmodel-days.\n", "expectation": "runs.healthy: glucose G falls from 250 to ~100 mg/dL, beta-cell mass B\ngrows from 37 to ~300, insulin I rises from 2.8 to ~10 -- the model's\nnormal-fasting-range stable state.\n"}, {"name": "beta_depleted_crosses_bifurcation", "gate_class": "acceptance_criterion", "observable": "runs.beta_depleted.{time,B,G,I}", "description": "The T2D-relevant beta-depleted composition (30% beta,\nb_init = 37 * 0.30 / 0.54 ~ 20.56) drives the SAME model across\nTopp2000's bifurcation into its pathological fixed point.\n", "expectation": "runs.beta_depleted: glucose G rises from 250 to ~600 mg/dL (severe\nhyperglycemia) while beta-cell mass B (from 20.56) and insulin I collapse\ntoward 0 -- the opposite stable regime from the healthy run.\n"}, {"name": "binding_is_nonhardcoded", "gate_class": "acceptance_criterion", "observable": "runs.\u003cscenario>.b_init / b_ref / beta_fraction", "description": "The CTpop-fraction -> beta-cell-mass binding reads the model's own\ndefault initial B out of the SBML rather than hardcoding it.\n", "expectation": "b_ref = 37 is read from BIOMD0000000341's SBML, and\nb_init = b_ref * beta_fraction / 0.54 reproduces 37 exactly at the 54%\nhealthy reference fraction.\n"}], "runs": [{"name": "baseline", "status": "completed", "outcomes": {"healthy_islet_physiological_fixed_point": {"result": "PARTIAL", "observed": "runs.healthy: glucose G falls from 250 to ~100 mg/dL, beta-cell mass B grows from 37 to ~300, insulin I rises from 2.8 to ~10 -- the model's normal-fasting-range stable state."}, "beta_depleted_crosses_bifurcation": {"result": "PARTIAL", "observed": "runs.beta_depleted: glucose G rises from 250 to ~600 mg/dL (severe hyperglycemia) while beta-cell mass B (from 20.56) and insulin I collapse toward 0 -- the opposite stable regime from the healthy run."}, "binding_is_nonhardcoded": {"result": "PARTIAL", "observed": "b_ref = 37 is read from BIOMD0000000341's SBML, and b_init = b_ref * beta_fraction / 0.54 reproduces 37 exactly at the 54% healthy reference fraction."}}}], "findings": [{"id": "F-01", "tier": "interpretation", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "Binding the documented healthy islet composition (54% beta) to\nTopp2000's initial beta-cell mass reproduces the model's own default\n(b_ref=37) and the model settles at its physiological fixed point\n(glucose ~100 mg/dL over 4,000 model-days). Binding the documented\nT2D-relevant beta-depleted composition (30% beta) scales the initial\nmass down to ~20.56 and the identical model crosses Topp2000's\nbeta-cell-mass bifurcation into its pathological fixed point (glucose\n~600 mg/dL, beta-cell mass and insulin collapsing toward 0) -- the\nCTpop composition mechanistically shifts which of the model's two\nstable regimes the glucose trajectory lands in, not merely its\nnumeric value.\n", "evidence": {"summary": "healthy (beta=0.54, b_init=37=b_ref): G 250->100.0, B 37->300.0, I 2.8->10.0 (physiological fixed point). beta_depleted (beta=0.30, b_init=20.56): G 250->600.0, B 20.56->~0, I 2.8->~0 (pathological fixed point) -- same model, same 4,000-model-day horizon, differing only in the CTpop-composition-bound initial beta-cell mass."}}], "limitations": ["`ISLET_COMPOSITION` is documented literature/HRA-ASCT+B composition (Cabrera et al. 2006 PNAS; Brissova et al. 2005), not a live HRA CTpop API pull for a specific RUI-registered tissue block -- a live CTpop endpoint is not (as of this writing) publicly exposed as JSON.", "Binding is initial-mass only: only the beta-cell fraction enters the Topp2000 model, and only as the initial condition for B, not as a rate/kinetic parameter -- alpha and delta fractions are identified (`ISLET_COMPOSITION`) but not bound to any Topp2000 parameter (the model has no glucagon/somatostatin compartment to bind them to).", "The 30% beta-depleted scenario is a single illustrative T2D-relevant composition point, not a distribution over real measured islets -- the exact glucose/insulin/beta-mass endpoints (600 / ~0 / ~0) are specific to this one fraction and this one model's parameterization, not a general dose-response curve."], "pipeline_gate": {"gate_evaluator": {"result": "needs_calibration"}, "prerequisites": [{"study": "ftu-model-coverage", "relation": "leads-to"}, {"study": "glucose-regulation", "relation": "builds-on"}]}, "literature_anchors": [{"expectation": "The Topp2000 beta-cell-mass model is fetched as a curated SBML BioModels entry (BIOMD0000000341).", "model_observable": "runs.\u003cscenario>.b_ref", "source": "Malik-Sheriff et al. 2020 -- supports BioModels as the curated source of the model this study parameterizes.", "cites": ["MalikSheriff2020BioModels"]}, {"expectation": "b_ref (37) is read out of the model's own SBML declaration, so the composition binding is model-driven, not hardcoded.", "model_observable": "runs.\u003cscenario>.b_ref", "source": "Hucka et al. 2003 -- supports SBML as the machine-readable model encoding b_ref is read from.", "cites": ["Hucka2003SBML"]}, {"expectation": "Trajectories are integrated by Tellurium's libRoadRunner over the model's DAYS timescale.", "model_observable": "runs.healthy.{time,B,G,I}", "source": "Somogyi et al. 2015 -- supports libRoadRunner as the integrator producing the trajectories.", "cites": ["Somogyi2015libRoadRunner"]}], "phase": "Decide", "design_status": "complete", "readouts": ["runs.healthy.{time,B,G,I} / runs.beta_depleted.{time,B,G,I} (Topp2000 trajectories)", "runs.\u003cscenario>.b_init / b_ref / beta_fraction (the CTpop-fraction -> beta-cell-mass binding)", "islet_composition (documented HRA-aligned beta/alpha/delta/PP-epsilon fractions + citations)", "reference_beta_fraction (0.54, the healthy-reference the binding scales against)"], "discovery_implications": {"resolved_uncertainties": ["CTpop islet composition, bound as an initial-condition parameter (beta-cell mass), does mechanistically change Topp2000's predicted glucose regulation -- realizing (for one covered FTU model and one composition-to-parameter binding) the RUI -> CTpop -> model parameterization vision `ftu-model-coverage`'s `ctpop_parameter_stub` only stubbed.", "The composition shift from healthy (54% beta) to T2D-relevant beta-depleted (30% beta) composition is large enough, in this model's parameterization, to cross a real bifurcation between the model's physiological and pathological fixed points -- not just perturb a number within one regime."], "remaining_uncertainties": ["Does a LIVE HRA CTpop count (for a specific RUI-registered islet tissue block) differ materially from the documented literature-average composition used here, and if so, in which direction?", "Should alpha/delta cell fractions bind to separate Topp2000-family or extended-model parameters (e.g. a glucagon-secretion term), rather than folding all islet composition information into the single beta-cell-mass initial condition?"], "followup_study_proposals": [{"id": "fp-ctpop-live-islet-binding", "title": "Bind a LIVE HRA CTpop islet cell count (not documented literature values) to Topp2000", "motivation": "This study proves the mechanism (composition -> beta-cell mass -> glucose regime) using documented literature composition; a live per-tissue-block CTpop count would let a specific RUI-registered islet be parameterized against its own measured composition rather than a population average.", "study_type": "mechanistic", "proposed_experiment": "When/if a live HRA CTpop JSON endpoint becomes available for a RUI-registered pancreatic-islet tissue block, fetch its real beta/alpha/delta-cell counts, compute the beta fraction from the real counts (not the documented 0.54/0.34/0.10/0.02 split), and re-run `compare_islet_compositions` with that live fraction in place of the documented one.", "expected_information_gain": "high", "source_trigger": "ctpop-islet-parameterization"}, {"id": "fp-ctpop-multi-parameter-islet-binding", "title": "Bind alpha/delta CTpop fractions to per-cell-type Topp-family model parameters", "motivation": "This study binds only the beta fraction (to initial beta-cell mass); a fuller CTpop -> model parameterization would also bind alpha/delta fractions to whichever islet-model parameters they mechanistically govern (e.g. a glucagon-secretion-capable extended model).", "study_type": "mechanistic", "proposed_experiment": "Identify or build an islet model with explicit alpha/delta-cell-mediated terms (e.g. glucagon counter-regulation), and bind CTpop alpha/delta fractions to those terms alongside the existing beta -> B binding, then compare against the beta-only binding used here.", "expected_information_gain": "medium", "source_trigger": "ctpop-islet-parameterization"}]}, "status": "complete", "slug": "ctpop-islet-parameterization", "execution_status": "completed", "sci_verdict": "qualified", "baseline_composite": null, "tests_counts": {"passed": 0, "skipped": 0, "failed": 0}, "verdict": "needs_calibration", "verdict_counts": {"passed": 0, "skipped": 0, "failed": 0}, "computed_gate_verdict": {"result": "needs_calibration"}, "run_commands": {"baseline": "vwb run study ctpop-islet-parameterization", "variants": [], "simulations": [], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "Blood Vasculature Network — VCCF transport graph to couple organ models", "question": "Can the HRA/VCCF vasculature data define a whole-body blood-transport\nnetwork — a directed heart -> organ -> heart circuit through named vessels —\nthat we can use to COUPLE independent organ simulations by advecting shared\nblood-borne solutes (glucose, O2, insulin, ...) between them? And what does a\nv1 blood-circulation simulation over that network look like?\n", "biological_summary": "Organ models in this atlas (glucose regulation across liver/pancreas/muscle,\nthe FTU digital objects, the biomodel corpus) are currently islands — each\nsimulates one tissue with no physical connection to the others. In the body\nthey are coupled by BLOOD: the heart drives a closed circuit that carries\nmetabolites and signals from organ to organ, so a change in hepatic glucose\noutput reaches the pancreatic beta-cell through the vasculature, with a\ntransport delay set by the path length and flow rate.\n\nThis study establishes the missing connective substrate. The HRA/VCCF\nvasculature data gives, for each of 28 functional tissue units, an ordered\nvessel path from a heart chamber out to the FTU's exchange capillary and back\n(arterial steps toward the FTU, venous steps returning) — e.g. the alveolus\nruns right ventricle -> pulmonary trunk -> ... -> alveolar capillary -> ... ->\nleft atrium. Taking the union over all 28 FTUs yields a directed whole-body\ntransport graph. On top of it, a blood-circulation simulation advects a shared\nplasma solute vector along the edges (a flow/resistance model sets the rates),\nand each organ node is an existing organ Process that exchanges solutes with\nthe blood it is perfused by — turning a set of isolated organ models into one\ncoupled, circulating whole.\n", "baseline": [{"name": "baseline", "composite": "viva_human_atlas.composites.vasculature_network_composite.blood-vasculature-network", "params": {"include_routes": true}}], "behavior_tests": [{"name": "closed-circuits", "gate_class": "regression_pin", "description": "Every one of the 28 FTU routes is a CLOSED circuit (starts and returns at a heart chamber) -- observed n_closed_circuits=28, n_open_routes=0."}, {"name": "graph-size", "gate_class": "regression_pin", "description": "The directed blood-transport graph spans 191 vessels and 444 flow edges across 4 vessel classes (observed 94 artery, 20 capillary, 73 vein, 4 chamber)."}, {"name": "topology-only", "gate_class": "regression_pin", "description": "This study delivers the validated topology + a design doc ONLY -- no flow rates (Q) or solute transport are simulated yet (simulation_status 'ran' refers to the data-pull/graph build, not a circulation run)."}], "runs": [{"name": "baseline", "status": "completed", "outcomes": {"closed-circuits": {"result": "PASS", "observed": "Every one of the 28 FTU routes is a CLOSED circuit (starts and returns at a heart chamber) -- observed n_closed_circuits=28, n_open_routes=0."}, "graph-size": {"result": "PASS", "observed": "The directed blood-transport graph spans 191 vessels and 444 flow edges across 4 vessel classes (observed 94 artery, 20 capillary, 73 vein, 4 chamber)."}, "topology-only": {"result": "PASS", "observed": "This study delivers the validated topology + a design doc ONLY -- no flow rates (Q) or solute transport are simulated yet (simulation_status 'ran' refers to the data-pull/graph build, not a circulation run)."}}}], "findings": [{"id": "F-01", "tier": "measurement", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "The VCCF data yields a fully closed whole-body transport graph: all 28\nFTU routes start and end at a heart chamber (28 closed circuits, 0 open),\nspanning 191 vessels and 444 directed flow edges (94 artery / 20\ncapillary / 73 vein / 4 chamber). The topology substrate for coupling\norgan models is therefore complete and validated.\n", "evidence": "VasculatureNetworkStep.update -> vascular_network_summary() over datasets/vasculature/ (FTU_Table_S1 + vccf/Vessel.csv)."}, {"id": "F-02", "tier": "interpretation", "mechanism_origin": "design", "claim_scope": "theoretical", "statement": "A blood-circulation simulation is designed on this graph (see\ndocs/blood-circulation-simulation-plan.md): a BloodTransportProcess\nadvects a shared plasma solute vector along the edges at flow rates Q set\nby a hemodynamic model (resistance network or the Font-Clos 2020\ncardiac-output partition), and each organ node is an existing organ\nProcess exchanging solutes with the blood perfusing it. Glucose\nregulation (liver \u003c-> pancreas \u003c-> muscle) is the proposed first coupling.\n", "evidence": "Design doc + the Font-Clos et al. 2020 whole-body organ-flow-network precedent (references/papers.bib)."}], "limitations": ["Topology only — no flow rates or solute transport simulated yet.", "Uses the 28 curated FTU paths; branch-point mixing (shared trunks) needs the VCCF Vessel.csv BranchesFrom tree.", "Vessel geometry (radii/lengths in vccf/Geometry.csv) not yet used to parameterize resistances."], "pipeline_gate": {"gate_evaluator": {"result": "passed"}, "prerequisites": [{"study": "hra-3d-crosswalk", "relation": "builds-on"}]}, "literature_anchors": [{"expectation": "The HRA/VCCF enumerates per-FTU vessel paths that can define a whole-body transport topology.", "model_observable": "n_ftus / n_closed_circuits over FTU_Table_S1", "source": "HRA functional tissue units + VCCF vasculature", "status_in_workspace": "confirmed: 28 FTU circuits, all closed", "cites": ["Bidanta2025FTU"]}], "phase": "Decide", "design_status": "complete", "readouts": ["vascular_network_summary.n_ftus / n_vessels / n_edges", "vascular_network_summary.vessel_classes (artery / capillary / vein / chamber counts)", "vascular_network_summary.n_closed_circuits vs n_open_routes (topology validation)", "ftu_routes[FTU] — the ordered heart -> FTU -> heart vessel path a solute travels"], "discovery_implications": "Establishes the blood-transport network as the connective substrate that lets\nthis atlas's organ models stop being islands: with per-edge flow and a shared\nplasma compartment, a change in one organ's solute exchange propagates to the\nothers with a physiologically-ordered transport delay. Next: implement the\nBloodTransportProcess and couple the glucose-regulation organ models as the\nfirst circulating multi-organ composite.\n", "status": "complete", "slug": "blood-vasculature-network", "execution_status": "completed", "sci_verdict": "qualified", "baseline_composite": "viva_human_atlas.composites.vasculature_network_composite.blood-vasculature-network", "tests_counts": {"passed": 3, "skipped": 0, "failed": 0}, "model_topology": {"processes": [{"name": "ftu_path_table_step", "kind": "step", "address": "local:viva_human_atlas.vasculature_step.FTUPathTableStep", "inputs": [], "outputs": ["ftu_table_json"], "doc": "Load the FTU heart->FTU->heart path table (FTU_Table_S1) from disk and emit the parsed paths + FTU ontology ids in-graph.", "compartments": []}, {"name": "vasculature_network_step", "kind": "step", "address": "local:viva_human_atlas.vasculature_step.VasculatureNetworkStep", "inputs": ["ftu_table_json"], "outputs": ["vascular_network_summary", "ftu_routes"], "doc": "Build a directed whole-body blood-transport graph from the FTU heart->FTU->heart paths (handed over in-graph by an upstream FTUPathTableStep), validating that every FTU closes a circuit through the heart.", "compartments": []}, {"name": "emitter", "kind": "step", "address": "local:RAMEmitter", "inputs": ["vascular_network_summary", "ftu_routes"], "outputs": [], "doc": "Store historical states in memory.", "compartments": []}], "stores": [{"name": "state", "type": null, "children": [{"name": "vascular_network_summary", "type": null, "children": []}, {"name": "ftu_routes", "type": null, "children": []}]}], "edges": [], "composite": "viva_human_atlas.composites.vasculature_network_composite.blood-vasculature-network"}, "verdict": "passed", "verdict_counts": {"passed": 3, "skipped": 0, "failed": 0}, "computed_gate_verdict": {"result": "passed"}, "run_commands": {"baseline": "vwb run study blood-vasculature-network --steps 1", "variants": [], "simulations": [], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "HRA Computational Model Atlas — organ selector + model-count gradient + subregion placement", "question": "Can we present the full HRA-3D model-coverage picture as an interactive\natlas — pick any of the 50 GLB-backed HRA organs, see it colored by how many\nmechanistic models are associated with it, browse straight to those\nBioModels — AND go one level deeper, placing models at the specific organ\nSUBREGIONS (anatomical structures) their cell types / FTUs resolve to,\nrather than distributing every model uniformly across the whole organ?\n", "biological_summary": "Mechanistic models cluster on a handful of organs (blood, pancreas, liver,\nbrain, intestine, heart) and leave most of the body's 3D anatomy unmodeled;\nand within a modeled organ, most models describe organ-wide biochemistry, not\na specific sub-structure. This Atlas Browser makes both legible. It is now\ngenerated from the (re-enriched) BioModels->HRA map DB (the biomodel-hra-map\nstudy's reusable JSON) rather than the older name/annotation catalogs, giving\n256 distinct models across 19 organs, and grouped by the HRA anatomical-systems\npartonomy (12 systems: Cardiovascular, Digestive, Respiratory, Excretory,\nNervous, Lymphoid, Hematopoietic, Integumental, Reproductive, Entire Sense\nOrgan, Anatomical Structure, Other) rather than the old hand-curated 10-system\nmap. On top of the organ-level count gradient, it places models at specific\nanatomical structures wherever the data supports it, two ways: (1) anatomy the\nmodel itself carries — an FTU, ontology, or (newly) gene-derived ASCT+B Uberon\nthat maps to a specific GLB mesh in the ASCT+B crosswalk; (2) a cell type\nplaced at an anatomical structure only where HRApop measures it enriched above\nthe organ average. The big jump comes from the DB enrichment: the ASCT+B\ngene->Uberon lever gave many models specific anatomical-structure Uberons that\nresolve to GLB meshes, so the anatomy path went 8 -> 58 models. That resolves\n64 models onto 52 subregions in 9 organs (58 via anatomy, 6 via cell type; 219\ntotal placements) — e.g. pancreas head of pancreas (16), intestine colon\nsegments (caecum, transverse/ascending/descending/sigmoid colon, rectum, ~10\neach), heart chambers (right ventricle 6, atria 5, interventricular septum 5)\n+ great arteries, blood arterial tree (renal/mesenteric/splenic/hepatic\narteries), lung segmental bronchus (8), brain hippocampal formation (4) +\nolfactory bulb, kidney outer cortex (5, cell-type enriched), lymph node\nefferent/afferent lymphatic vessels + medulla + follicle, trachea carina +\ncartilage — colored on a warm ramp so a modeled structure pops out of its\norgan. Everything else falls back to the whole organ, which is still the\nhonest majority: HRApop's anatomical structures are coarse (gross regions, not\nFTUs), and the curated FTUs themselves (islet, glomerulus, lobule, alveolus)\nstill have no 3D-crosswalk mesh — so liver, though heavily modeled, stays\nwhole-organ. The machinery is general: as the DB enrichment, HRApop coverage,\nthe 3D crosswalk, or per-model annotation improve, more subregions light up\nautomatically. The end-to-end, reproducible build that ties this together is\npresented as one connected composite in the atlas-pipeline study.\n", "baseline": [{"name": "baseline", "step": "local:viva_human_atlas.atlas_browser.ComputationalModelAtlas", "params": {"db_path": "datasets/model_hra_map.json", "enrichment": 1.25, "cross_organ_max": 0}}], "behavior_tests": [{"name": "all-organs-selectable", "gate_class": "regression_pin", "description": "The atlas manifest enumerates all 50 GLB-backed HRA organs in 12 anatomical systems, with 19 carrying >=1 model (256 distinct models, blood 52 max)."}, {"name": "subregion-placement", "gate_class": "regression_pin", "description": "Placement driven up from models' anatomy + cell types resolves 64 models onto 52 organ subregions in 9 organs (58 via anatomy, 6 via cell-type enrichment; 219 total placements)."}, {"name": "honest-whole-organ-fallback", "gate_class": "regression_pin", "description": "Models that resolve to no subregion fall back to the whole organ -- including every model in heavily-modeled liver, because the curated FTUs (islet, glomerulus, lobule, alveolus) have no ASCT+B-3D mesh to color -- the honest majority given the data."}], "runs": [{"name": "baseline", "status": "completed", "outcomes": {"all-organs-selectable": {"result": "PASS", "observed": "The atlas manifest enumerates all 50 GLB-backed HRA organs in 12 anatomical systems, with 19 carrying >=1 model (256 distinct models, blood 52 max)."}, "subregion-placement": {"result": "PASS", "observed": "Placement driven up from models' anatomy + cell types resolves 64 models onto 52 organ subregions in 9 organs (58 via anatomy, 6 via cell-type enrichment; 219 total placements)."}, "honest-whole-organ-fallback": {"result": "PASS", "observed": "Models that resolve to no subregion fall back to the whole organ -- including every model in heavily-modeled liver, because the curated FTUs (islet, glomerulus, lobule, alveolus) have no ASCT+B-3D mesh to color -- the honest majority given…"}}}], "findings": [{"id": "F-01", "tier": "interpretation", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "The atlas manifest enumerates all 50 GLB-backed HRA organs, grouped by\nthe HRA anatomical-systems partonomy (12 systems), and colors the 19\nmodeled ones by model count (blood 52 max, 256 distinct models), now\ngenerated from the re-enriched BioModels->HRA map DB rather than the\nolder name/annotation catalogs — a whole-atlas overview of where\nmechanistic modeling exists, each organ linking to its BioModels.\n", "evidence": {"summary": "50 organs in 12 HRA anatomical systems, 19 modeled (256 distinct / 417 total), max_models=52 (blood); 31 organs greyed. Source: model_hra_map.json organ->models. Newly modeled via gene-derived anatomy: thymus (43), placenta (26), spinal cord (9), trachea (8), main bronchus (7)."}}, {"id": "F-02", "tier": "measurement", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "Driving placement up from the models' own anatomy annotations (now\nincluding gene-derived ASCT+B Uberons) + cell types resolves 64 models\nonto 52 organ subregions in 9 organs — pancreas head of pancreas (16),\nintestine colon segments (~10 each), heart chambers + great arteries,\nblood arterial tree, lung segmental bronchus (8), brain hippocampal\nformation (4) + olfactory bulb, kidney outer cortex (5, cell-type\nenriched), lymph node lymphatic vessels + medulla + follicle, trachea\ncarina + cartilage — replacing uniform within-organ distribution with\nper-anatomical-structure coloring where the data supports it, and falling\nback to the whole organ elsewhere.\n", "evidence": {"summary": "place_models: n_subregion_models=64 (n_anatomy_models=58, n_cell_type_models=6), 52 subregions in 9 organs, 219 total placements. The DB enrichment (ASCT+B gene->Uberon) drove the anatomy path 8 -> 58: gene-derived anatomical-structure Uberons resolve to crosswalk GLB meshes (pancreas head of pancreas, colon segments, heart chambers, lung segmental bronchus, brain hippocampal formation). Cell-type path (6, unchanged): kidney models' cell types enrich in the outer cortex (E>1.25 vs organ average)."}}], "limitations": ["The CELL-TYPE placement path is still bounded by HRApop's coarse anatomical-structure granularity (gross regions, not FTUs) — most cell types are spread evenly across an organ's structures and enrich in none, so only 6 models place via cell-type enrichment; the 58-model jump came from the gene-derived ASCT+B anatomy path, not from cell types.", "The curated FTUs themselves (pancreatic islet UBERON:0000006, glomerulus, liver lobule, lung alveolus) still have NO mesh in the ASCT+B-3D crosswalk, so FTU-direct placement fires only for FTUs that do (lymph node follicle); pancreas now places at the gene-derived head-of-pancreas gross region rather than its islet FTU, and heavily modeled liver still stays whole-organ.", "Cross-organ cell-type placement is off by default: the mostly-generic cell types models carry (from the MeSH crosswalk) are not specific enough to place a model into an organ it isn't tagged to without smearing many models onto the most-subdivided organs (colon, lung)."], "pipeline_gate": {"gate_evaluator": {"result": "passed"}, "prerequisites": [{"study": "biomodel-hra-map", "relation": "leads-to"}, {"study": "annotation-recall-gain", "relation": "leads-to"}, {"study": "corpus-coverage", "relation": "builds-on"}, {"study": "spatial-linkage", "relation": "builds-on"}]}, "literature_anchors": [{"expectation": "Mechanistic models can be presented on the HRA's 3D reference organs and anatomical-systems partonomy, colored by coverage.", "model_observable": "atlas manifest n_organs / n_modeled / n_subregions", "source": "HRA reference organs + anatomical-systems partonomy", "status_in_workspace": "confirmed: 50 organs / 12 systems / 19 modeled / 52 subregions", "cites": ["Boerner2021HRA"]}, {"expectation": "The HRA Knowledge Graph's structured anatomy/enrichment data (ASCT+B gene->Uberon, HRApop) drives model-to-structure placement.", "model_observable": "n_anatomy_models / n_cell_type_models placement split", "source": "HRA Knowledge Graph", "status_in_workspace": "confirmed: 58 anatomy + 6 cell-type placements", "cites": ["Bueckle2025HRAKG"]}], "phase": "Decide", "design_status": "complete", "readouts": ["atlas manifest: n_organs (50), n_systems (12, HRA anatomical-systems partonomy), n_modeled (19), n_models_distinct (256), n_models_total (417), max_models (52), n_subregions (52), n_organs_with_subregions (9)", "placement stats: n_subregion_models (64), n_anatomy_models (58), n_cell_type_models (6), n_placements_total (219)", "per-organ n_models + BioModels list; per-organ `subregions` (node_names, Uberon, per-structure model list with placement `via`: anatomy | cell_type)"], "discovery_implications": {"resolved_uncertainties": ["The Atlas Browser can be generated directly from the reusable BioModels->HRA map DB (biomodel-hra-map), grouped by the HRA anatomical-systems partonomy (12 systems), and can place models at specific organ subregions driven by their anatomy (including gene-derived ASCT+B Uberons) / cell types, not just at whole organs — realizing the fp-as-level-coverage follow-up.", "The DB enrichment (ASCT+B gene->Uberon) drove the anatomy placement path 8 -> 58 models, so where the data supports it (pancreas head of pancreas, colon segments, heart chambers, lung segmental bronchus, kidney cortex, lymph-node vessels/follicle, brain hippocampal formation, trachea carina) per-anatomical-structure coloring replaces uniform within-organ distribution; where it does not (e.g. liver), whole-organ fallback is the honest and correct behavior."], "remaining_uncertainties": ["Would an FTU->AS mesh crosswalk covering islet/glomerulus/lobule (or a finer HRApop-derived per-AS index) resolve the heavily modeled liver into subregions at its functional units, rather than the gross gene-derived regions the models place at now?", "Can a stricter, cell-type-specificity-aware cross-organ gate light up multi-organ placement for genuinely cell-type-defined models without the generic-cell-type smear?"], "followup_study_proposals": [{"id": "fp-ftu-mesh-crosswalk", "title": "An FTU -> 3D-mesh crosswalk so islet/glomerulus/lobule models place at their FTU", "motivation": "The strongest subregion signal (a model's FTU) can't be shown for pancreas/liver/kidney-nephron because those FTUs have no ASCT+B-3D mesh — an FTU->representative-mesh mapping would place the largest modeled organs' models at their functional units.", "study_type": "method-upgrade", "proposed_experiment": "Build/curate an FTU-Uberon -> GLB-node crosswalk (e.g. islet -> a pancreas-body region, glomerulus -> renal cortex), and place FTU models onto those meshes; measure the subregion coverage gain.", "expected_information_gain": "high", "source_trigger": "hra-atlas-browser"}, {"id": "fp-specificity-cross-organ", "title": "Cell-type-specificity-gated cross-organ placement", "motivation": "A model defined by a specific cell type legitimately maps to several organs; the current generic-cell-type signal smears, so cross-organ is off. A specificity score (how few organs a cell type occurs in) could re-enable it safely.", "study_type": "method-upgrade", "proposed_experiment": "Weight each cell type by its cross-organ specificity in HRApop, and admit cross-organ placement only for models whose cell types are specific; compare against the within-organ-only default.", "expected_information_gain": "medium", "source_trigger": "hra-atlas-browser"}]}, "status": "complete", "slug": "hra-atlas-browser", "execution_status": "completed", "sci_verdict": "qualified", "baseline_composite": null, "tests_counts": {"passed": 3, "skipped": 0, "failed": 0}, "figures_embedded": [{"name": "Index", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>HRA Computational Model Atlas — organs by model coverage\u003c/title>\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"color-scheme\" content=\"dark\">\n  \u003cstyle>\n    :root {\n      --bg:#0e1116; --panel:#161b22; --text:#d6dde3; --text-dim:#8a96a3;\n      --border:#2a313c; --nomodel:#5a616b; --accent:#4caf78;\n      --menu-w:320px; --panel-w:300px;\n    }\n    *{box-sizing:border-box;}\n    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);\n      font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;font-size:13px;overflow:hidden;}\n    #app{position:relative;width:100vw;height:100vh;}\n    canvas{display:block;width:100%;height:100%;}\n    header{position:absolute;top:0;left:0;right:0;z-index:20;background:var(--panel);\n      border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:14px;}\n    header h1{font-size:14px;font-weight:600;margin:0;}\n    header h1 .sub{display:block;color:var(--text-dim);font-weight:400;font-size:12px;margin-top:1px;}\n    header button{background:var(--bg);color:var(--text);border:1px solid var(--border);\n      border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;}\n    header button:hover{border-color:var(--accent);}\n    /* About drop-down */\n    #about-wrap{position:relative;}\n    #about-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:40;width:320px;\n      background:var(--panel);border:1px solid var(--border);border-radius:8px;\n      box-shadow:0 8px 28px rgba(0,0,0,.45);padding:14px 15px;text-align:left;\n      font-size:12px;line-height:1.5;color:var(--text);}\n    #about-menu[hidden]{display:none;}\n    #about-menu .about-title{font-weight:600;font-size:13px;margin-bottom:7px;}\n    #about-menu .about-p{color:var(--text-dim);margin:0 0 9px;}\n    #about-menu a{color:var(--accent);text-decoration:none;}\n    #about-menu a:hover{text-decoration:underline;}\n    #about-menu .about-links{display:flex;flex-direction:column;gap:5px;\n      padding:9px 0;margin:2px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}\n    #about-menu .about-foot{margin-top:10px;color:var(--text-dim);}\n    #about-menu .about-foot em{color:var(--text);font-style:italic;}\n    /* Female | Male segmented toggle */\n    #sex-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}\n    #sex-toggle button{border:none;border-radius:0;padding:4px 12px;background:var(--bg);\n      color:var(--text-dim);font-size:12px;cursor:pointer;}\n    #sex-toggle button+button{border-left:1px solid var(--border);}\n    #sex-toggle button:hover{color:var(--text);}\n    #sex-toggle button.active{color:var(--accent);background:rgba(76,175,120,.14);\n      box-shadow:inset 0 0 0 1px var(--accent);}\n    #summary-line{color:var(--text-dim);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums;}\n    .card{position:absolute;background:var(--panel);border:1px solid var(--border);\n      border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);}\n\n    /* ---- left organ menu ---- */\n    #organ-menu{top:52px;left:12px;bottom:12px;width:var(--menu-w);\n      display:flex;flex-direction:column;overflow:hidden;}\n    #organ-search{margin:10px 40px 6px 10px;padding:6px 9px;background:var(--bg);color:var(--text);\n      border:1px solid var(--border);border-radius:6px;font-size:12px;}\n    #organ-search::placeholder{color:var(--text-dim);}\n    #menu-controls{display:flex;align-items:center;gap:6px;padding:0 10px 8px;\n      border-bottom:1px solid var(--border);}\n    #menu-controls button{background:var(--bg);color:var(--text);border:1px solid var(--border);\n      border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;}\n    #menu-controls button:hover{border-color:var(--accent);}\n    #menu-controls .count{margin-left:auto;color:var(--text-dim);font-size:11px;\n      font-variant-numeric:tabular-nums;}\n    #organ-list{flex:1;overflow-y:auto;padding:2px 0;}\n\n    /* ---- system group headers ---- */\n    .group-head{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;\n      background:rgba(255,255,255,.02);border-top:1px solid var(--border);\n      font-size:11.5px;font-weight:600;letter-spacing:.02em;user-select:none;}\n    .group-head:hover{background:var(--bg);}\n    .group-head .caret{width:10px;color:var(--text-dim);font-size:10px;transition:transform .12s;}\n    .organ-group.collapsed .caret{transform:rotate(-90deg);}\n    .organ-group.collapsed .group-body{display:none;}\n    .group-head .gchk{width:13px;height:13px;flex-shrink:0;border:1px solid var(--border);\n      border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);}\n    .group-head .gchk.on{background:var(--accent);border-color:var(--accent);}\n    .group-head .gchk.partial{background:#2f6f4f;border-color:#2f6f4f;color:var(--text);}\n    .group-head .gname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n    .group-head .gcount{color:var(--text-dim);font-weight:400;font-size:10.5px;\n      font-variant-numeric:tabular-nums;}\n    .group-head .gonly{color:var(--text-dim);font-weight:400;font-size:10.5px;\n      border:1px solid var(--border);border-radius:5px;padding:1px 6px;visibility:hidden;}\n    .group-head:hover .gonly{visibility:visible;}\n    .group-head .gonly:hover{border-color:var(--accent);color:var(--text);}\n    .organ-row{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 22px;cursor:pointer;\n      border-left:3px solid transparent;}\n    .organ-row:hover{background:var(--bg);}\n    .organ-row.selected{background:var(--bg);border-left-color:var(--accent);}\n    .organ-row .chk{width:13px;height:13px;flex-shrink:0;border:1px solid var(--border);\n      border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);}\n    .organ-row.selected .chk{background:var(--accent);border-color:var(--accent);}\n    .organ-row .sw{width:11px;height:11px;border-radius:50%;flex-shrink:0;\n      border:1px solid rgba(255,255,255,.18);}\n    .organ-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n    .organ-row.zero .nm{color:var(--text-dim);}\n    .organ-row .ct{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;flex-shrink:0;}\n    .organ-row .only,.organ-row .explode{flex-shrink:0;color:var(--text-dim);font-size:10.5px;\n      border:1px solid var(--border);border-radius:5px;padding:1px 6px;visibility:hidden;}\n    .organ-row:hover .only,.organ-row:hover .explode{visibility:visible;}\n    .organ-row .only:hover,.organ-row .explode:hover{border-color:var(--accent);color:var(--text);}\n\n    #legend{border-top:1px solid var(--border);padding:9px 12px;font-size:11.5px;}\n    #legend .bar{height:9px;width:100%;border-radius:5px;margin:5px 0;\n      background:linear-gradient(90deg,#ffffd9,#edf8b1,#c7e9b4,#7fcdbb,#41b6c4,#1d91c0,#225ea8,#253494,#081d58);}\n    #legend .scale{display:flex;justify-content:space-between;color:var(--text-dim);}\n    #legend .nomodel-row{display:flex;align-items:center;gap:7px;margin-top:5px;}\n    #legend .swatch{width:11px;height:11px;border-radius:50%;background:var(--nomodel);\n      border:1px solid rgba(255,255,255,.15);}\n\n    /* ---- right BioModels panel ---- */\n    #biomodels-panel{top:52px;right:12px;width:var(--panel-w);max-height:calc(100% - 76px);\n      display:flex;flex-direction:column;overflow:hidden;}\n    #biomodels-panel .bp-head{padding:10px 14px;border-bottom:1px solid var(--border);}\n    #biomodels-panel .bp-title{font-weight:600;font-size:13px;padding-right:26px;}\n    #biomodels-panel .bp-sub{color:var(--text-dim);font-size:11.5px;margin-top:2px;}\n    #model-search{margin-top:8px;width:100%;padding:6px 9px;background:var(--bg);color:var(--text);\n      border:1px solid var(--border);border-radius:6px;font-size:12px;}\n    #model-search::placeholder{color:var(--text-dim);}\n    #biomodels-list .organ-group-head{padding:7px 14px 3px;font-size:11px;font-weight:600;\n      color:var(--text-dim);letter-spacing:.02em;display:flex;align-items:center;gap:7px;}\n    #biomodels-list .organ-group-head .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;\n      border:1px solid rgba(255,255,255,.18);}\n    #biomodels-list{overflow-y:auto;padding:6px 0;}\n    #biomodels-list a{display:block;padding:6px 14px;color:var(--text);text-decoration:none;\n      border-bottom:1px solid rgba(255,255,255,.04);}\n    #biomodels-list a:hover{background:var(--bg);}\n    #biomodels-list .mid{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;}\n    #biomodels-list .empty{padding:10px 14px;color:var(--text-dim);}\n    .prov{font-size:9.5px;padding:1px 5px;border-radius:4px;vertical-align:middle;\n      white-space:nowrap;border:1px solid transparent;}\n    .prov-name{background:rgba(76,175,120,.16);color:#8fe6b0;border-color:rgba(76,175,120,.35);}\n    .prov-annotation{background:rgba(120,110,220,.18);color:#b9b2f0;border-color:rgba(120,110,220,.4);}\n    .prov-both{background:rgba(253,231,55,.16);color:#f0e27a;border-color:rgba(253,231,55,.35);}\n    /* source badge: which repository (BioModels vs PhysioNet) a model came\n       from — a distinct color family from the .prov provenance badges above,\n       so the two badge kinds never read as the same signal. */\n    .src-badge{font-size:9.5px;padding:1px 5px;border-radius:4px;vertical-align:middle;\n      white-space:nowrap;border:1px solid transparent;text-transform:uppercase;letter-spacing:.02em;}\n    .src-biomodels{background:rgba(76,146,255,.18);color:#9dc4ff;border-color:rgba(76,146,255,.4);}\n    .src-physionet{background:rgba(255,138,76,.18);color:#ffbf9d;border-color:rgba(255,138,76,.4);}\n    .src-physiome{background:rgba(123,216,143,.18);color:#a6e9b8;border-color:rgba(123,216,143,.4);}\n    /* mapping-confidence badge: how trustworthy the model->organ placement is */\n    .conf-badge{font-size:9px;padding:1px 5px;border-radius:4px;vertical-align:middle;\n      white-space:nowrap;border:1px solid transparent;text-transform:uppercase;letter-spacing:.02em;opacity:.9;}\n    .conf-high{background:rgba(76,175,120,.14);color:#8fe6b0;border-color:rgba(76,175,120,.3);}\n    .conf-medium{background:rgba(253,231,55,.12);color:#e6d86a;border-color:rgba(253,231,55,.28);}\n    .conf-low{background:rgba(255,138,76,.12);color:#ffbf9d;border-color:rgba(255,138,76,.28);}\n    /* physiological-process groups: anatomical structure -> process -> model */\n    .proc-group{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;\n      padding:6px 4px 4px;margin-top:6px;border-top:1px solid var(--border);}\n    .proc-group:first-child{margin-top:0;border-top:none;}\n    .proc-caret{color:var(--text-dim);font-size:10px;width:10px;flex-shrink:0;}\n    .proc-name{font-size:12px;font-weight:600;color:var(--text);flex:1;\n      text-transform:uppercase;letter-spacing:.03em;}\n    .proc-count{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-dim);\n      background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 8px;}\n    .proc-group:hover .proc-name{color:var(--accent);}\n    .proc-body.collapsed{display:none;}\n    .proc-controls{display:flex;gap:12px;justify-content:flex-end;padding:2px 4px 6px;}\n    .proc-ctl{background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px;}\n    .proc-ctl:hover{color:var(--accent);}\n    .region-divider{margin-top:12px;padding-top:8px;border-top:1px dashed var(--border);\n      font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);}\n    /* modeled-subregion chooser rows in the focused-organ panel + back-link */\n    .sub-row{display:flex;align-items:center;justify-content:space-between;gap:8px;\n      padding:6px 14px;cursor:pointer;border-left:2px solid transparent;}\n    .sub-row:hover{background:var(--bg);border-left-color:var(--accent);}\n    .sub-name{font-size:12px;color:var(--text);}\n    .sub-count{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;\n      white-space:nowrap;}\n    .sub-back{padding:6px 14px;color:var(--text-dim);font-size:11.5px;cursor:pointer;}\n    .sub-back:hover{color:var(--accent);}\n    /* source toggle chips: one per repository present in the data, all on by\n       default (combined list); click to narrow. Per-chip count is for the\n       current organ/subregion/search. */\n    .source-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}\n    .source-chips .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;font-size:11px;\n      border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);\n      cursor:pointer;user-select:none;white-space:nowrap;}\n    .source-chips .chip:hover{border-color:var(--accent);}\n    .source-chips .chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}\n    .source-chips .chip .cnt{font-variant-numeric:tabular-nums;color:var(--text-dim);}\n    .source-chips .chip.off{opacity:.4;}\n    .source-chips .chip.off .dot{filter:grayscale(1);}\n    /* ---- resizable / collapsible side panels ---- */\n    .resizer{position:absolute;top:52px;bottom:12px;width:11px;z-index:15;cursor:col-resize;\n      touch-action:none;display:flex;align-items:center;justify-content:center;}\n    .resizer::after{content:\"\";width:3px;height:34px;border-radius:2px;background:var(--border);\n      transition:background .12s,height .12s;}\n    .resizer:hover::after,.resizer.active::after{background:var(--accent);height:64px;}\n    #resize-left{left:calc(var(--menu-w) + 12px);}\n    #resize-right{right:calc(var(--panel-w) + 12px);}\n    body.left-collapsed #resize-left{display:none;}\n    body.right-collapsed #resize-right{display:none;}\n    .collapse-btn{position:absolute;top:8px;right:8px;z-index:8;width:24px;height:22px;padding:0;\n      display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text-dim);\n      border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:15px;line-height:1;}\n    .collapse-btn:hover{border-color:var(--accent);color:var(--text);}\n    #organ-menu.collapsed,#biomodels-panel.collapsed{display:none;}\n    .reopen-tab{position:absolute;top:60px;z-index:19;display:none;align-items:center;gap:6px;\n      background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 12px;\n      cursor:pointer;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);}\n    .reopen-tab:hover{border-color:var(--accent);}\n    #reopen-left{left:0;border-left:none;border-radius:0 8px 8px 0;}\n    #reopen-right{right:0;border-right:none;border-radius:8px 0 0 8px;}\n    .reopen-tab.show{display:inline-flex;}\n    #status{position:absolute;bottom:14px;left:calc(var(--menu-w) + 28px);z-index:20;\n      color:var(--text-dim);font-size:11.5px;}\n  \u003c/style>\n  \u003cscript type=\"importmap\">\n  {\"imports\":{\n    \"three\":\"https://unpkg.com/three@0.160.0/build/three.module.js\",\n    \"three/addons/\":\"https://unpkg.com/three@0.160.0/examples/jsm/\"}}\n  \u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"app\">\n    \u003cheader>\n      \u003ch1>HRA Computational Model Atlas\u003cspan class=\"sub\">organs by model coverage\u003c/span>\u003c/h1>\n      \u003cdiv id=\"sex-toggle\" role=\"group\" aria-label=\"Sex\">\n        \u003cbutton id=\"sex-female\" type=\"button\" class=\"active\" title=\"Show female anatomy\">Female\u003c/button>\n        \u003cbutton id=\"sex-male\" type=\"button\" title=\"Show male anatomy\">Male\u003c/button>\n      \u003c/div>\n      \u003cbutton id=\"btn-center\" type=\"button\" title=\"Center the view on the visible organs (or press F)\">Center view\u003c/button>\n      \u003cbutton id=\"btn-download\" type=\"button\" title=\"Download the atlas metadata as JSON\">Download JSON\u003c/button>\n      \u003cdiv id=\"about-wrap\">\n        \u003cbutton id=\"btn-about\" type=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" title=\"About this atlas\">About ▾\u003c/button>\n        \u003cdiv id=\"about-menu\" role=\"menu\" hidden>\n          \u003cdiv class=\"about-title\">HRA Computational Model Atlas\u003c/div>\n          \u003cp class=\"about-p\">An anatomical index of \u003cstrong>executable computational models\u003c/strong> of the human body — 689 models across 23 organs (BioModels · Physiome · PhysioNet), placed onto the \u003ca href=\"https://humanatlas.io\" target=\"_blank\" rel=\"noopener\">Human Reference Atlas\u003c/a> and grouped by physiological process.\u003c/p>\n          \u003cp class=\"about-p\">Its model corpus and HRA mapping are assembled by a process-bigraph workspace built with \u003ca href=\"https://vivarium-collective.github.io\" target=\"_blank\" rel=\"noopener\">Vivarium\u003c/a>; this 3D browser renders that data with three.js.\u003c/p>\n          \u003cdiv class=\"about-links\">\n            \u003ca href=\"https://github.com/vivarium-collective/viva-human-atlas\" target=\"_blank\" rel=\"noopener\">Source &amp; data on GitHub ↗\u003c/a>\n            \u003ca href=\"https://vivarium-collective.github.io\" target=\"_blank\" rel=\"noopener\">Vivarium Lab ↗\u003c/a>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"summary-line\">loading…\u003c/div>\n    \u003c/header>\n\n    \u003caside id=\"organ-menu\" class=\"card\">\n      \u003cbutton id=\"collapse-left\" class=\"collapse-btn\" type=\"button\" title=\"Collapse organ panel\" aria-label=\"Collapse organ panel\">‹\u003c/button>\n      \u003cinput id=\"organ-search\" type=\"search\" placeholder=\"Filter organs…\" aria-label=\"Filter organs\">\n      \u003cdiv id=\"menu-controls\">\n        \u003cbutton id=\"btn-all-modeled\" type=\"button\" title=\"Show all organs that have >=1 model\">All modeled\u003c/button>\n        \u003cbutton id=\"btn-all\" type=\"button\" title=\"Show all 50 organs (heavier)\">All\u003c/button>\n        \u003cbutton id=\"btn-collapse-all\" type=\"button\" title=\"Collapse all systems\">Collapse\u003c/button>\n        \u003cbutton id=\"btn-expand-all\" type=\"button\" title=\"Expand all systems\">Expand\u003c/button>\n        \u003cspan class=\"count\" id=\"sel-count\">\u003c/span>\n      \u003c/div>\n      \u003cdiv id=\"organ-list\">\u003c/div>\n      \u003cdiv id=\"legend\">\n        \u003cdiv>models per organ\u003c/div>\n        \u003cdiv class=\"bar\">\u003c/div>\n        \u003cdiv class=\"scale\">\u003cspan>1\u003c/span>\u003cspan id=\"legend-max\">—\u003c/span>\u003c/div>\n        \u003cdiv class=\"nomodel-row\">\u003cspan class=\"swatch\">\u003c/span>\u003cspan>no model\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/aside>\n\n    \u003cdiv id=\"biomodels-panel\" class=\"card\">\n      \u003cbutton id=\"collapse-right\" class=\"collapse-btn\" type=\"button\" title=\"Collapse models panel\" aria-label=\"Collapse models panel\">›\u003c/button>\n      \u003cdiv class=\"bp-head\">\n        \u003cdiv class=\"bp-title\" id=\"bp-title\">Select an organ\u003c/div>\n        \u003cdiv class=\"bp-sub\" id=\"bp-sub\">\u003c/div>\n        \u003cinput id=\"model-search\" type=\"search\" placeholder=\"Filter models (keyword)…\"\n               aria-label=\"Filter models by keyword\">\n        \u003cdiv id=\"source-chips\" data-source-filter class=\"source-chips\"\n             role=\"group\" aria-label=\"Filter models by source\">\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"biomodels-list\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"resize-left\" class=\"resizer\" title=\"Drag to resize the organ panel\">\u003c/div>\n    \u003cdiv id=\"resize-right\" class=\"resizer\" title=\"Drag to resize the models panel\">\u003c/div>\n\n    \u003cbutton id=\"reopen-left\" class=\"reopen-tab\" type=\"button\" title=\"Show organ panel\">☰ Organs\u003c/button>\n    \u003cbutton id=\"reopen-right\" class=\"reopen-tab\" type=\"button\" title=\"Show models panel\">☰ Models\u003c/button>\n\n    \u003cdiv id=\"status\">loading…\u003c/div>\n  \u003c/div>\n  \u003cscript type=\"module\" src=\"./viewer.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "verdict": "passed", "verdict_counts": {"passed": 3, "skipped": 0, "failed": 0}, "computed_gate_verdict": {"result": "passed"}, "run_commands": {"baseline": "vwb run study hra-atlas-browser", "variants": [], "simulations": [], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "HRA Computational Model Atlas — the end-to-end, reproducible build pipeline", "question": "How is the HRA Computational Model Atlas actually built — end to end, from\nexternal model repositories and Human Reference Atlas services down to the\natlas.json the 3D viewer renders — and can that whole build be run as ONE\nconnected process-bigraph composite that reproducibly regenerates the same\nartifact offline, with every stage visible and connectable in the modules tab?\n", "biological_summary": "The atlas the viewer shows is the end of a multi-source harvest-and-enrich\npipeline, not a single query. Mechanistic models are pulled from three\nrepositories (BioModels, the Physiome Model Repository, PhysioNet), each\nmodel's anatomy is resolved from its own SBML/BioPAX identifiers, its paper's\nMeSH terms, and (after enrichment) its genes' ASCT+B Uberon anatomy; the\nHuman Reference Atlas contributes the ASCT+B tables, the HRApop measured\ncell-type populations, and the ASCT+B-3D crosswalk that ties a model's cell\ntypes/FTUs to specific 3D organ subregions. This study makes that whole chain\na single connected composite: each stage is a Step with typed ports, wired\nthrough the model->HRA map DB as the shared artifact, ending at the atlas pack\nthe 3D browser renders. Because the committed datasets are the frozen\nsnapshot, the pipeline run offline replays them and regenerates the exact same\natlas.json — so the figure is reproducible, and the machinery to refresh it\nfrom the live sources (organism, genes, HRApop, new models) is the same graph\nrun with live=true.\n", "baseline": [{"name": "baseline", "composite": "viva_human_atlas.composites.atlas_pipeline.hra-atlas-pipeline", "params": {"out_dir": "studies/hra-atlas-browser/viz/atlas", "live": false}}], "behavior_tests": [{"name": "offline-byte-identical", "gate_class": "regression_pin", "description": "Two offline runs of the hra-atlas-pipeline composite regenerate atlas.json byte-identically, and the offline run reproduces the committed atlas readouts exactly (50 organs, 24 modeled, 689 distinct models, 52 subregions in 9 organs)."}, {"name": "connected-step-dag", "gate_class": "regression_pin", "description": "The build is ONE connected Step DAG (ModelHarvest + AsctbTables -> GeneEnrich + HRApopEnrich -> ComputationalModelAtlas), every stage a first-class Step in the modules tab -- not a pile of loose scripts."}], "runs": [{"name": "baseline", "status": "completed", "outcomes": {"offline-byte-identical": {"result": "PASS", "observed": "Two offline runs of the hra-atlas-pipeline composite regenerate atlas.json byte-identically, and the offline run reproduces the committed atlas readouts exactly (50 organs, 24 modeled, 689 distinct models, 52 subregions in 9 organs)."}, "connected-step-dag": {"result": "PASS", "observed": "The build is ONE connected Step DAG (ModelHarvest + AsctbTables -> GeneEnrich + HRApopEnrich -> ComputationalModelAtlas), every stage a first-class Step in the modules tab -- not a pile of loose scripts."}}}], "findings": [{"id": "F-01", "tier": "interpretation", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "The full atlas build is a single connected process-bigraph composite:\nModelHarvestStep and AsctbTablesStep feed GeneEnrichStep and\nHRApopEnrichStep, which feed ComputationalModelAtlas, wired through the\nmodel->HRA map DB as the shared artifact. Every stage — including the two\nenrichment stages and the BTO->Uberon crosswalk that were previously loose\nscripts — is now a first-class Step visible and connectable in the modules\ntab / Composite Explorer.\n", "evidence": {"summary": "5 Steps wired via per-stage stores (db_harvested, asctb_path, db_gene, db_hrapop); enrich/crosswalk stages promoted from scripts to Steps sharing their core with the CLIs (cannot diverge). Composite spec id: viva_human_atlas.composites.atlas_pipeline.hra-atlas-pipeline."}}, {"id": "F-02", "tier": "measurement", "mechanism_origin": "engineered", "claim_scope": "mechanism", "statement": "Run offline, the pipeline reproducibly regenerates the committed\natlas.json: it reproduces the committed atlas readouts exactly (50 organs,\n24 modeled, 689 distinct models, 52 subregions in 9 organs), and two\noffline runs produce byte-identical atlas.json. The committed datasets are\nthe frozen snapshot; live=true re-harvests from the source APIs.\n", "evidence": {"summary": "tests/test_atlas_pipeline_composite.py asserts regenerated readouts == committed readouts (no hardcoded numbers); tests/test_atlas_pipeline_reproducible.py asserts two offline runs are byte-identical. Verified independently: build_and_write_atlas from the committed DB is byte-identical to the committed atlas.json."}}], "limitations": ["Reproducibility is offline-replay of the committed datasets; a live re-harvest (live=true) drifts with the upstream BioModels/Physiome/PhysioNet repositories, HRA services, UniProt/ENA, and the LLM literature extraction, and is not bit-identical run-to-run.", "This study adds no new biological findings; the subregion-placement science and coverage numbers are inherited from the hra-atlas-browser study."], "pipeline_gate": {"gate_evaluator": {"result": "passed"}, "prerequisites": [{"study": "model-harvest", "relation": "builds-on"}, {"study": "biomodel-hra-map", "relation": "builds-on"}, {"study": "hra-atlas-browser", "relation": "builds-on"}]}, "literature_anchors": [{"expectation": "The atlas is built over the HRA reference organs and anatomical-systems partonomy.", "model_observable": "regenerated atlas manifest n_organs / n_modeled / n_subregions", "source": "HRA reference organs + partonomy", "status_in_workspace": "confirmed: offline rebuild reproduces 50 organs / 24 modeled / 689 models / 52 subregions", "cites": ["Boerner2021HRA"]}, {"expectation": "The pipeline harvests HRA Knowledge Graph data (ASCT+B tables, HRApop populations, gene->Uberon) to enrich and place models.", "model_observable": "the 5-Step DAG's ASCT+B / HRApop enrichment stages feeding atlas placement", "source": "HRA Knowledge Graph construction/deployment", "status_in_workspace": "confirmed: AsctbTablesStep + HRApopEnrichStep wired into the composite", "cites": ["Bueckle2025HRAKG"]}], "phase": "Decide", "design_status": "complete", "readouts": ["pipeline: 5 connected Steps (ModelHarvest -> {GeneEnrich, HRApopEnrich} -> ComputationalModelAtlas; AsctbTables feeds GeneEnrich), plus BtoCrosswalkStep surfaced in the modules tab", "atlas manifest reproduced offline: n_organs (50), n_systems (12), n_modeled (24), n_models_distinct (689), n_subregions (52), n_organs_with_subregions (9)", "reproducibility: two offline runs regenerate atlas.json byte-identically; offline run reproduces th <script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
// Static bigraph of the composite — a self-contained SVG that reads like a
// process-bigraph: the PLACE GRAPH (compartments as containers holding their
// state leaves) on the right, the PROCESS nodes (with typed in/out ports) on the
// left, and the LINK GRAPH (each process wired to every compartment it reads or
// writes) drawn as connectors between them. Compartments, their state leaves and
// the wiring are all derived from the topology's edges ({p: process, c:
// compartment, s: state}); the declared store tree fills in any unwired
// compartments + leaf types. No server, no interactivity — embeds + prints.
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], edges=topo.edges||[], storeTree=topo.stores||[];

  // --- Derive the bigraph: compartment -> state leaves, and link weights. ---
  const compStates=new Map();          // compartment -> Set(state names)
  const typeOf={};                     // "comp" or "comp.state" -> type label
  edges.forEach(e=>{ if(e.c==null) return;
    if(!compStates.has(e.c)) compStates.set(e.c,new Set());
    if(e.s) compStates.get(e.c).add(e.s); });
  (function walk(ns){ (ns||[]).forEach(n=>{ if(n.name==null) return;
    if(!compStates.has(n.name)) compStates.set(n.name,new Set());
    if(n.type) typeOf[n.name]=n.type;
    (n.children||[]).forEach(ch=>{ if(ch.name){ compStates.get(n.name).add(ch.name);
      if(ch.type) typeOf[n.name+'.'+ch.name]=ch.type; } }); }); })(storeTree);
  const comps=[...compStates.keys()];
  if(!procs.length && !comps.length) return '';
  const linkStates={};                 // "proc|comp" -> Set(shared state names)
  edges.forEach(e=>{ if(e.p==null||e.c==null) return; const k=e.p+'|'+e.c;
    (linkStates[k]||(linkStates[k]=new Set())).add(e.s); });
  const outSet={};                     // proc -> Set(output port names) for read/write colouring
  procs.forEach(p=>{ outSet[p.name]=new Set(p.outputs||[]); });
  // Keep a process box's text on one line: truncate a port list to ~max chars,
  // trailing "+N" for the remainder, and clip an over-long address.
  const portStr=(arr,max)=>{ arr=(arr||[]).map(String); if(!arr.length) return '—';
    let out='',i=0; for(; i<arr.length; i++){ const nxt=out?out+', '+arr[i]:arr[i]; if(nxt.length>max && out) break; out=nxt; }
    const rem=arr.length-i; return (out.length>max?out.slice(0,max-1)+'…':out)+(rem>0?` +${rem}`:''); };
  const clip=(s,max)=>{ s=String(s||''); return s.length>max?s.slice(0,max-1)+'…':s; };

  // --- Geometry: processes (left column) ⇄ compartments (right column). ---
  const PADX=14, TOP=30, GAP=118, PW=236, CW=210, VGAP=16;
  const ph=p=>20+(p.address?13:0)+14+14+12;            // process box height
  const ch=c=>{ const n=compStates.get(c).size; return 22+(n?n*15+8:8); };  // compartment box height
  const procY={}; let py=TOP; procs.forEach(p=>{ procY[p.name]=py; py+=ph(p)+VGAP; });
  const compY={}; let cy=TOP; comps.forEach(c=>{ compY[c]=cy; cy+=ch(c)+VGAP; });
  const procX=PADX, compX=PADX+PW+GAP;
  const W=compX+CW+PADX, H=Math.max(py,cy)+6;

  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${procX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  sv+=`<text x="${compX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">COMPARTMENTS · STATE</text>`;

  // Link graph first, so the node boxes sit on top of the wires. A link is a
  // "write" (accent) when the process outputs any of the states it shares with
  // that compartment, else a "read" (muted); thickness grows with shared states.
  Object.keys(linkStates).forEach(k=>{ const [pn,cn]=k.split('|');
    if(procY[pn]==null||compY[cn]==null) return;
    const y1=procY[pn]+ph(procs.find(p=>p.name===pn))/2, y2=compY[cn]+ch(cn)/2;
    const x1=procX+PW, x2=compX, mx=(x1+x2)/2;
    const sts=linkStates[k], os=outSet[pn]||new Set();
    const write=[...sts].some(s=>os.has(s));
    const w=Math.min(4,sts.size), col=write?'var(--accent)':'var(--line-2)';
    sv+=`<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" `+
        `stroke="${col}" stroke-width="${0.8+w*0.5}" opacity="${write?0.55:0.4}"/>`;
  });

  // Process nodes: name, address, typed in/out ports.
  procs.forEach(p=>{ const y=procY[p.name], h=ph(p); let ty=y+21;
    sv+=`<rect x="${procX}" y="${y}" width="${PW}" height="${h}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<circle cx="${procX+PW}" cy="${y+h/2}" r="3.5" fill="var(--accent)"/>`;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`; ty+=15;
    if(p.address){ sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(clip(p.address,34))}</text>`; ty+=14; }
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc(portStr(p.inputs,30))}</tspan></text>`; ty+=14;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc(portStr(p.outputs,29))}</tspan></text>`;
  });

  // Compartment containers (place graph): header + nested state leaves.
  comps.forEach(c=>{ const y=compY[c], h=ch(c), states=[...compStates.get(c)];
    sv+=`<rect x="${compX}" y="${y}" width="${CW}" height="${h}" rx="8" fill="var(--sunken)" stroke="var(--line)"/>`;
    sv+=`<circle cx="${compX}" cy="${y+h/2}" r="3.5" fill="var(--ink-3)"/>`;
    sv+=`<text x="${compX+11}" y="${y+15}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="11.5">${esc(c)}</text>`;
    if(typeOf[c]) sv+=`<text x="${compX+CW-10}" y="${y+15}" text-anchor="end" fill="var(--ink-3)" font-size="9.5" font-family="var(--mono)">${esc(typeOf[c])}</text>`;
    states.forEach((s,j)=>{ const ly=y+22+j*15;
      sv+=`<rect x="${compX+9}" y="${ly}" width="${CW-18}" height="13" rx="3" fill="var(--surface)" stroke="var(--line)"/>`;
      sv+=`<text x="${compX+15}" y="${ly+10}" fill="var(--ink-2)" font-family="var(--mono)" font-size="10">${esc(s)}</text>`;
      const tt=typeOf[c+'.'+s]; if(tt) sv+=`<text x="${compX+CW-14}" y="${ly+10}" text-anchor="end" fill="var(--accent)" font-size="9" font-family="var(--mono)">${esc(tt)}</text>`;
    });
  });

  sv+=`</svg>`;
  const nLinks=Object.keys(linkStates).length;
  const cap=`Static bigraph of <span class="mono">${esc(topo.composite||'')}</span> — `+
    `${procs.length} process${procs.length==1?'':'es'} wired to ${comps.length} compartment${comps.length==1?'':'s'}`+
    (nLinks?` over ${nLinks} link${nLinks==1?'':'s'}`:'')+`. `+
    `<span style="color:var(--accent)">●</span> writes · <span style="color:var(--ink-3)">●</span> reads.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// Shared id counter for the loom-embed helpers below (loomRealEmbed).
let _ILOOM_SEQ=0;

// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
// PRIMARY Model view (published bundle only): the REAL bigraph-loom, embedded
// chromeless + stripped (?embed=1) and driven by the composite-state snapshot
// that ships beside the report. This is the genuine loom renderer — process
// rectangles, store circles, the place-graph nesting and wiring, click a process
// for its contract — not a re-drawing. The two base URLs come from the DATA
// (INV.loom_embed), set only when publishing alongside the loom bundle; a
// standalone/self-contained report has no INV.loom_embed, so this returns '' and
// the Model section falls back to the inlined image / static topology.
// setupRealLooms() mounts it lazily and, if it can't boot, reveals the fallback.
function loomRealEmbed(s){
  const le=INV.loom_embed; if(!le||!le.loom||!le.state) return '';
  const cid=(s.model_topology&&s.model_topology.composite)||(s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const stateUrl=le.state+encodeURIComponent(cid)+'.json';
  const src=le.loom+'?embed=1&static=1&stateUrl='+encodeURIComponent(stateUrl)+'&tab=explore';
  const fb=(s.model_loom
      ? `<div class="loom-frame" style="height:auto;max-height:640px;overflow:auto"><img src="${s.model_loom}" alt="bigraph-loom view of ${esc(cid)}" style="width:100%;display:block"/></div>`
      : (s.model_topology?loomTopoSVG(s.model_topology):''))||'';
  const id='loomreal'+(++_ILOOM_SEQ);
  return `<figure class="loom-embed loom-real" id="${id}" data-loomsrc="${esc(src)}">
      <div class="loom-real-slot"><div class="loom-real-boot">loading bigraph-loom…</div></div>
      <div class="loom-real-fallback" hidden>${fb}</div>
      <figcaption><b>bigraph-loom</b> — <span class="mono">${esc(cid)}</span>: the composite's process-bigraph (process rectangles, store nodes, and their wiring). Click a process for its contract; drag to pan, scroll to zoom.</figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open'],planned:['planned','Planned']};
  const [c,l]=map[kind]||map.warn; return `<span class="status ${c}"><span class="g"></span>${l}</span>`;
}
function gateOf(s){ // pass / fail / planned / warn
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';
  // Not yet gated: a study the author marks Planned (or with no run at all) is
  // DESIGNED-not-run — a distinct state from an evaluated-but-open gate, so the
  // report never paints a not-yet-run study as if it had passed. Prefer the
  // server's canonical execution_status (study_ontology) over guessing from the
  // absence of runs.
  const ex=String(s.execution_status||'').toLowerCase();
  if(ex==='planned'||ex==='proposed') return 'planned';
  const c=(s.confidence||'').toLowerCase();
  if(c==='planned') return 'planned';
  if(!ex && !s.gate_status && !(s.runs&&s.runs.length)) return 'planned';
  return 'warn';
}
/* ---------- citation chips (provenance → References) ---------- */
let REFS={};
function refChip(key){
  if(!key) return '';
  const r=REFS[key]; const lbl=(r&&r.label)||key;
  const title=r&&r.title?` title="${esc(r.title)}"`:'';
  return `<a class="refchip${r?'':' unknown'}" href="#ref-${esc(key)}"${title}>${esc(lbl)}</a>`;
}
function citeRow(keys,label){
  const ks=(keys||[]).filter(Boolean);
  if(!ks.length) return '';
  return `<span class="citerow">${label?`<span class="cite-lbl">${esc(label)}</span>`:''}${ks.map(refChip).join('')}</span>`;
}
function isControl(s){ return gateOf(s)==='fail' && (s.confidence==='Refuted'||s.confidence==='Accepted') && !!s.conclusion; }
function loopOutcome(s){
  const r=(s.runs||[]).map(r=>r.outcomes&&r.outcomes['LOOP-OUTCOME']).find(Boolean);
  return r||null;
}

/* ---------- SVG visualizations ---------- */
// V1 capability coverage matrix: rows=requires, cols=chosen modules(+build-new), fill where provided
function vizCapMatrix(s,inv){
  const req=s.requires||[]; const mods=(s.sourcing&&s.sourcing.modules)||[];
  const cat=inv.catalog||{};
  if(!req.length) return '';
  const cols = mods.length?mods:['(build-new)'];

// V4 margin ladder (study, build)

// V5 iteration timeline
function timelineSteps(traj){
  if(!traj||!traj.iterations) return '';
  const steps=traj.iterations.map(it=>{
    const d=it.decision||{}; const act=d.action||d.kind||'';
    let label=act;
    if(d.mechanism) label='install '+d.mechanism;
    else if(d.value) label=(d.action||'')+' '+d.value;
    else if(act==='done') label='DONE';
    else if(act==='blocked'||act==='install') label=act;
    const reason=d.reasoning||d.note||'';
    return {it:it.iteration,label,reason,np:it.n_pass,nh:it.n_hard};
  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}
