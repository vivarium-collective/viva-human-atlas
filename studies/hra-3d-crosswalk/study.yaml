schema_version: 4
name: hra-3d-crosswalk
title: "HRA 3D Crosswalk — Full ASCT+B-3D Anatomical-Structure Tree"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Does the HRA CDN's ASCT+B-3D models crosswalk load into a Step-driven
  composite, giving the full 1,400+ anatomical-structure (AS) tree — not
  just the ~81 per-organ reference-organ GLBs — with resolvable Uberon CURIEs
  and source-organ GLB names?

study_card:
  goal: "Fetch the ASCT+B-3D crosswalk CSV via HRACrosswalkStep and confirm the composite loads a non-empty, Uberon-annotated anatomical-structure list."
  mechanism: "HRACrosswalkStep.update -> fetch_crosswalk(CROSSWALK_URL) -> parse CSV rows after the `anatomical_structure_of` header -> one store -> RAMEmitter."
  expected_result: "1,400+ anatomical-structure rows load, most with a resolvable Uberon CURIE (`mesh` rows) and some `organizational` rows with no Uberon, each carrying its source-organ GLB name and parent node."
  main_expert_question: "Is the crosswalk's Uberon coverage complete/stable enough to key organ-granularity model coverage off of (Task B), or does its `organizational`/missing-Uberon fraction undercut that?"

biological_summary: |
  The Human Reference Atlas (HRA) publishes ~81 whole-organ 3D reference
  models (per-sex GLB scenes), but a mechanistic model rarely maps cleanly
  onto a whole organ — it targets a lobe, duct, nephron segment, or other
  sub-organ anatomical structure (AS). The ASCT+B-3D models crosswalk is the
  HRA's digital object that cuts each reference-organ GLB into its
  constituent AS scene nodes and keys each to a Uberon CURIE where the node
  is directly ontology-representable (`mesh` node type), leaving purely
  structural grouping nodes (`organizational`) unkeyed. This is the
  substrate every downstream HRA-3D coverage/linkage step (Tasks B and C)
  crosses against the BioModels-derived organ annotations, so its size,
  Uberon-density, and organ span set the ceiling on how fine-grained model
  coverage can ever be reported.

readouts:
  - "count of anatomical-structure rows loaded"
  - "fraction of rows with a resolvable UBERON: CURIE (vs organizational/empty)"
  - "count of distinct source-organ GLBs referenced"

report:
  title: "HRA 3D Crosswalk — full ASCT+B-3D anatomical-structure tree loads"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    Does the HRA CDN's ASCT+B-3D models crosswalk load into a Step-driven
    composite, giving the full anatomical-structure (AS) tree with
    resolvable Uberon CURIEs and source-organ GLB names?
  conclusion: |
    The live composite loads 2,295 anatomical-structure rows spanning 116
    distinct source-organ GLBs (both sexes). 1,730/2,295 rows (75.4%) carry
    a resolvable UBERON: CURIE (`node_type=mesh`, 1,410 rows) or
    `surface` (464 rows); the remaining 419 `organizational` rows (18.3%,
    plus 2 blank) are pure grouping nodes with no Uberon and are correctly
    excluded from coverage computation (`coverage.build_coverage` skips
    rows with an empty `uberon`). This exceeds the ~1,400+ AS nodes
    originally estimated and comfortably clears the ~81-reference-organ
    floor, confirming the crosswalk gives materially finer anatomical
    granularity than the whole-organ GLBs alone.
  caveat: |
    Uberon coverage is real but partial (75.4%, not 100%) — the
    `organizational` fraction (18.3%) is structurally un-keyable (they are
    grouping nodes, not anatomy), so organ-granularity coverage
    (`model-coverage-3d`/`corpus-coverage`) can never reach 100% of raw
    crosswalk rows even with a complete model corpus; this is a data-model
    ceiling, not a bug.

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.hra_steps.hra-3d-crosswalk
    params:
      url: "https://cdn.humanatlas.io/digital-objects/ref-organ/asct-b-3d-models-crosswalk/latest/assets/asct-b-3d-models-crosswalk.csv"

embed_visualizations:
  - name: "AS nodes per organ"
    url: "/reports/figures/hra-3d-crosswalk/as-per-organ.html"
    description: "Bar chart of anatomical-structure node counts per source-organ GLB (top 20 of 116 organs) from the live crosswalk fetch: 2,295 rows total, 1,730 with a resolvable Uberon CURIE."

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The live ASCT+B-3D crosswalk fetch loads 2,295 anatomical-structure
      rows spanning 116 distinct source-organ GLBs; 1,730/2,295 (75.4%)
      carry a resolvable UBERON: CURIE, exceeding the ~1,400+ AS-node
      original estimate and comfortably clearing the ~81-reference-organ
      floor -- confirming the crosswalk gives materially finer anatomical
      granularity than the whole-organ GLBs alone.
    evidence:
      summary: "2,295 rows loaded, 116 source-organ GLBs; 1,730/2,295 (75.4%) UBERON-keyed (1,410 mesh + 464 surface rows); 419 organizational rows (18.3%) structurally un-keyable."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline live fetch and CSV parse of the ASCT+B-3D crosswalk completed without error."
  biological_validation:
    basis: "The endpoint returns the expected data shape/counts (2,295 rows, exceeding the ~1,400+ estimate) with 75.4% resolvable to Uberon -- the Step-based fetch is accurate to the live crosswalk."
  explanatory_gain:
    basis: "F-01 quantifies the 75.4% Uberon-density ceiling that bounds every downstream organ-granularity coverage computation (model-coverage-3d, corpus-coverage)."

limitations:
  - "The 18.3% organizational-row fraction is structurally un-keyable (pure grouping nodes, not anatomy), so downstream organ-granularity coverage can never reach 100% of raw crosswalk rows even with a complete model corpus -- a data-model ceiling, not a bug."

discovery_implications:
  resolved_uncertainties:
    - "The crosswalk exceeds the original ~1,400+ AS-node estimate (2,295 rows / 1,730 Uberon-keyed), confirming it gives materially finer granularity than the 81 whole-organ GLBs."
  remaining_uncertainties:
    - "Can the 18.3% organizational/unkeyed rows ever be resolved to Uberon, or is that a permanent ceiling on organ-granularity coverage?"
  followup_study_proposals: []
