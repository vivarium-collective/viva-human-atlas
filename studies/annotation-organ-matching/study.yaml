schema_version: 4
name: annotation-organ-matching
investigation: hra-integration
title: "Annotation-Based Organ Matching — SBML MIRIAM + BTO Crosswalk Provenance"
created: '2026-08-01'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Decide

question: |
  How does a BioModels entry get tagged with an HRA Uberon organ when the
  match comes from its embedded SBML MIRIAM annotations rather than its
  name — and which biological CVTerm qualifiers / ontologies actually carry
  that organ signal?

study_card:
  goal: "Summarize the committed annotation-based organ-matching catalog (datasets/biomodel_annotation_catalog.json, Task 4): how many models/organs it reaches, and, per organ tag, which biological qualifier and which ontology (Uberon/FMA/BTO) produced it -- transparently, down to the specific CVTerm."
  mechanism: "AnnotationMatchStep.update -> load_annotation_envelope(catalog_path) -> scan every biomodel_dos[].organs[].via entry (the SBML CVTerm hit: curie, biological qualifier, element) -> annotation_summary{n_ids, n_tagged, n_organs, qualifier_counts, ontology_counts} + sample_provenance -> RAMEmitter. Organ resolution itself (annotation_match.annotate_model) walks each model/compartment/species CVTerm, extracts an Uberon/FMA/BTO CURIE, and maps it to an HRA organ_index entry directly (Uberon/FMA) or via a curated 32-entry BTO->organ crosswalk (BTO terms, BRENDA Tissue Ontology, are what BioModels curators attach almost universally; direct Uberon/FMA hits are comparatively rare)."
  expected_result: "The organ signal is dominated by BTO-mediated hits (via the crosswalk) rather than direct Uberon/FMA MIRIAM matches, because BioModels curation practice annotates tissue/cell context with BTO far more often than with Uberon/FMA directly."
  main_expert_question: "Which biological qualifiers / ontologies carry the most organ signal?"

biological_summary: |
  BioModels curators annotate SBML elements (the model itself, compartments,
  species) with MIRIAM CVTerms: a biological qualifier (e.g. "is", "is part
  of", "occurs in") plus a resource URI naming an ontology term. Very few
  entries carry a direct Uberon/FMA anatomical term; most instead carry a
  BRENDA Tissue Ontology (BTO) term describing the cell line, tissue sample,
  or assay context the model was parameterized against. `annotation_match.py`
  extracts every such CVTerm hit, and where it's BTO, resolves it to an HRA
  Uberon organ via a curated 32-entry BTO->organ crosswalk
  (`datasets/bto_uberon_crosswalk.json`) -- this crosswalk is *the* mechanism
  that makes BTO-heavy BioModels annotation practice usable as organ
  evidence at all; without it, only the rare direct Uberon/FMA hits would
  resolve.

readouts:
  - "annotation_summary.n_ids / n_tagged (catalog envelope: corpus size, organ-tagged count)"
  - "annotation_summary.n_organs (distinct organs reached)"
  - "annotation_summary.qualifier_counts (biological CVTerm qualifier -> hit count)"
  - "annotation_summary.ontology_counts (ontology prefix -> hit count: BTO vs UBERON/FMA)"

report:
  title: "Annotation Organ Matching — 114/1,096 models, 14 organs, driven almost entirely by BTO"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    How does annotation-based organ matching work mechanically, and which
    qualifiers/ontologies actually carry the organ signal?
  conclusion: |
    The committed annotation catalog (`datasets/biomodel_annotation_catalog.json`)
    tags 114/1,096 models (10.4%) with an HRA organ across 14 distinct
    organs. Of the 168 individual CVTerm hits behind those tags, 156 (92.9%)
    resolve via a BTO term through the curated 32-entry BTO->organ
    crosswalk, and only 12 (7.1%) resolve via a direct Uberon/FMA MIRIAM
    match -- confirming BTO is overwhelmingly the dominant anatomy signal in
    BioModels' own curation practice (278 models in the corpus carry a BTO
    term at all; the crosswalk is what turns that into organ evidence). By
    biological qualifier, `BQB_OCCURS_IN` (88 hits) and `BQB_IS` (40 hits)
    dominate, with `BQB_IS_VERSION_OF` (35), `BQB_IS_PART_OF` (4), and
    `BQB_HAS_PART` (1) trailing -- curators overwhelmingly express anatomy as
    "this model occurs in / is this tissue" rather than compositional
    part-of relationships.
  caveat: |
    The BTO->organ crosswalk is a curated 32-entry mapping, not a complete
    BTO->Uberon bridge -- BTO terms outside that crosswalk contribute
    nothing, so the 92.9% BTO-hit share measures the crosswalk's reach
    within the catalog it produced, not BTO's full potential organ signal
    across the corpus. Extending the crosswalk is the most direct lever to
    raise `annotation-recall-gain`'s coverage numbers further.

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.annotation_composite.annotation-organ-matching
    params:
      catalog_path: "datasets/biomodel_annotation_catalog.json"

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Of the 168 CVTerm hits behind the annotation catalog's 114 organ-tagged
      models, 156 (92.9%) resolve through the curated BTO->organ crosswalk
      and only 12 (7.1%) through a direct Uberon/FMA MIRIAM match --
      BTO-via-crosswalk is the dominant, not incidental, organ-matching
      mechanism, and `BQB_OCCURS_IN`/`BQB_IS` are the dominant qualifiers
      (88 and 40 of 168 hits).
    evidence:
      summary: "ontology_counts: BTO 156, UBERON 12; qualifier_counts: BQB_OCCURS_IN 88, BQB_IS 40, BQB_IS_VERSION_OF 35, BQB_IS_PART_OF 4, BQB_HAS_PART 1; 114/1,096 models tagged (10.4%), 14 organs."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline annotation-organ-matching composite (committed catalog scan) completed without error."
  biological_validation:
    basis: "The qualifier/ontology breakdown matches expected BioModels curation practice: tissue/cell-line context (BTO) is annotated far more often than direct anatomical ontology terms (Uberon/FMA), and 'occurs in'/'is' qualifiers dominate over compositional part-of relationships."
  explanatory_gain:
    basis: "F-01 makes the annotation-matching mechanism transparent and falsifiable: the BTO->organ crosswalk, not direct Uberon/FMA annotation, is what does 92.9% of the work, directly motivating crosswalk-extension as the next lever (see annotation-recall-gain)."

limitations:
  - "The 32-entry BTO->organ crosswalk is curated, not exhaustive -- BTO terms it doesn't cover contribute zero organ signal, so the 92.9% BTO share is a lower bound on BTO's true anatomical relevance in this corpus."
  - "sample_provenance surfaces only the first 10 organ-tagged models for spot-checking, not a systematic precision audit of every hit."

discovery_implications:
  resolved_uncertainties:
    - "BTO-mediated matching (via the curated crosswalk), not direct Uberon/FMA MIRIAM annotation, is the dominant organ-tagging mechanism in this BioModels corpus (156 vs 12 hits)."
  remaining_uncertainties:
    - "How much more organ coverage would extending the 32-entry BTO->organ crosswalk unlock, given 278 corpus models carry a BTO term at all vs the 114 that currently resolve to an organ?"
  followup_study_proposals:
    - id: fp-bto-crosswalk-extension
      title: "BTO->organ crosswalk extension"
      motivation: "278 models carry a BTO term but only 114 resolve to an organ through the current 32-entry crosswalk; extending the crosswalk against the remaining BTO terms in the corpus could raise annotation-based organ-tagging recall further."
      study_type: method-upgrade
      proposed_experiment: "Enumerate the distinct BTO terms present across all 278 BTO-annotated corpus models, identify which are absent from the current 32-entry crosswalk, and curate organ mappings for the highest-frequency gaps."
      expected_information_gain: medium
      source_trigger: annotation-organ-matching
