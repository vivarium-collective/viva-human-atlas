schema_version: 4
name: hra-reference-organs
title: "HRA Reference Organs — Uberon-Keyed Organ Set"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Does the HRA CCF API's reference-organs endpoint load into a Step-driven
  composite, giving an Uberon-keyed organ set (with per-sex GLB assets)?

study_card:
  goal: "Fetch HRA reference organs via HRAReferenceOrgansStep and confirm the composite loads a non-empty, Uberon-annotated organ list."
  mechanism: "HRAReferenceOrgansStep.update -> fetch_reference_organs(HRA_API) -> one store -> RAMEmitter."
  expected_result: "The full HRA reference-organ set (~77 organs, some sex-split) loads with a parsed organ slug, Uberon (or FMA) CURIE, sex, and GLB asset URL per entry."
  main_expert_question: "Is the reference-organ set stable enough (schema + coverage) to key downstream biomodel annotation off of?"

readouts:
  - "count of reference organs loaded"
  - "fraction of organs with a UBERON-prefixed uberon CURIE (vs FMA)"

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.hra_steps.hra-reference-organs
    params:
      base_url: "https://apps.humanatlas.io/api"
