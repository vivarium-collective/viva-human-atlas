findings:
- id: F-01
  tier: interpretation
  mechanism_origin: engineered
  claim_scope: mechanism
  statement: |
    The HRA reference-organs endpoint returns 81 real organ entries
    across 58 distinct organ slugs, 69/81 (85.2%) resolving to a
    UBERON-prefixed CURIE, split 45 female-specific / 36 male-specific --
    confirming the Step-based fetch drives a complete, ontology-keyed
    whole-organ scaffold that downstream biomodel annotation and the 3D
    crosswalk both key off of.
  evidence:
    summary: "81 entries, 58 organ slugs, 69/81 (85.2%) UBERON-keyed, 45 female / 36 male entries."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline live fetch against the HRA CCF reference-organs endpoint completed without error."
  biological_validation:
    basis: "The endpoint returns the expected data shape and counts: 81 organ entries, 85.2% Uberon-keyed, correctly split by sex where anatomy differs -- the Step-based fetch is accurate to the live API."
  explanatory_gain:
    basis: "F-01 quantifies exactly how Uberon-complete (85.2%) and sex-split (45/36) the anchor organ set is, setting expectations for every downstream Uberon-keyed match."

limitations:
- "14.8% of entries (12/81) parse to a non-Uberon FMA identifier; downstream Uberon-only matching silently drops these rather than flagging a translation gap."

discovery_implications:
  resolved_uncertainties:
  - "The reference-organ set is stable, complete (81 entries), and predominantly Uberon-keyed (85.2%) -- a trustworthy anchor for downstream annotation."
  remaining_uncertainties:
  - "Should the 12 FMA-only organs be cross-walked to Uberon so downstream matching doesn't silently drop them?"
  followup_study_proposals:
  - id: fp-organ-result-overlay
    title: "Result-driven reference-organ overlay"
    motivation: "Overlay model readouts (steady-state values) on the reference-organ 3D GLBs, feeding the result-driven spatial-link viewer."
    study_type: data-pipeline
    proposed_experiment: "Extract per-organ steady-state readouts from the committed corpus COPASI/Tellurium comparison dataset and attach them to the matching reference-organ entries (by Uberon), rendering the reference-organ 3D viewer colored by that value instead of a flat coverage flag."
    expected_information_gain: medium
    source_trigger: hra-reference-organs

