assumptions:
- text: "A CURIE is counted as Uberon-keyed only when its prefix is literally UBERON:; the 14.8% FMA-prefixed entries are therefore treated as not-Uberon-keyed, so downstream Uberon-only matching silently drops them."
  cites: [Mungall2012Uberon]
- text: "The reference-organ set is treated as the stable anatomical anchor every downstream hra-integration study keys off; its Uberon CURIEs are assumed stable across HRA CCF-API releases."
  cites: [Boerner2021HRA]

literature_anchors:
- expectation: "The HRA provides a per-sex, Uberon-keyed whole-organ reference set as the spatial scaffold of the atlas."
  model_observable: "81 reference-organ entries loaded; 69 UBERON-keyed; split 45 female-specific / 36 male-specific."
  source: "Boerner et al. 2021, the Human Reference Atlas / Common Coordinate Framework."
  status_in_workspace: "Verified"
  cites: [Boerner2021HRA]
- expectation: "Whole organs are identified by Uberon anatomy CURIEs."
  model_observable: "69/81 entries resolve to a UBERON: CURIE (the remainder to FMA)."
  source: "Mungall et al. 2012, Uberon integrated anatomy ontology."
  status_in_workspace: "Verified"
  cites: [Mungall2012Uberon]

alternative_hypotheses:
- claim: "The reference-organ set is too sparsely Uberon-annotated to serve as a Uberon-keyed anchor (most entries fall back to FMA)."
  discriminated_by: "85.2% (69/81) of entries carry a UBERON CURIE and only 14.8% are FMA, so Uberon dominates and the set is a usable Uberon anchor; the 12 FMA-only organs are a bounded, enumerated gap, not a pervasive one."
  status: excluded
