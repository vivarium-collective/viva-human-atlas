schema_version: 4
name: ctpop-islet-parameterization
investigation: hra-3d
title: "CTpop -> Topp2000 Islet Parameterization — Beta-Cell Composition Shifts the Glucose Setpoint"
created: '2026-07-26'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Decide

question: |
  Does binding HRA CTpop islet cell-type composition to the Topp2000
  beta-cell-mass model (BIOMD0000000341) change the predicted glucose
  regulation -- realizing the RUI -> CTpop -> model parameterization vision
  Katy Boerner / Peter Hunter / SPARC describe, for the pancreatic islet FTU
  `ftu-model-coverage` already found covered?

study_card:
  goal: "Map a documented HRA-aligned islet beta-cell fraction onto the Topp2000 model's initial beta-cell mass (B), and run healthy (54% beta) vs beta-depleted (30% beta, the T2D-relevant loss) scenarios to see whether the composition shift changes the model's predicted glucose trajectory."
  mechanism: "CtpopIsletParameterizationStep.update -> compare_islet_compositions((0.54, 0.30)) -> per fraction: _fetch_topp_sbml(BIOMD0000000341) via the `biomodels` package -> _default_b_ref_from_sbml reads the model's own default initial B (37) out of the SBML -> beta_fraction_to_beta_mass(beta_fraction, b_ref) = b_ref * beta_fraction / 0.54 -> pbg_tellurium.TelluriumProcess loaded on the SBML with species_overrides={'B': b_init} -> one continuous roadrunner.simulate(0, 4000, 200) call over the model's DAYS timescale -> {time, B, G, I} trajectory -> RAMEmitter."
  expected_result: "The healthy islet (54% beta, b_init=37=b_ref) settles near the model's physiological fixed point (G ~100 mg/dL); the beta-depleted islet (30% beta, b_init~20.6) crosses the model's bifurcation into its pathological fixed point (G ~600 mg/dL, B and I collapsing toward 0) -- a real, mechanistically-driven glucose-regulation consequence of the composition shift, not a cosmetic one."
  main_expert_question: "Is proportional initial-mass rescaling (B_init = b_ref * beta_fraction / 0.54) a defensible way to bind a CTpop cell-type fraction to this model, or should alpha/delta fractions also enter via separate parameters (e.g. glucagon secretion, insulin-secretion modulation) rather than folding everything into B alone?"

biological_summary: |
  `ftu-model-coverage` identified the pancreatic islet as an HRA functional
  tissue unit already covered by curated BioModels (Topp2000, Jiang2007,
  Bertram2007) and stubbed (via `ctpop_parameter_stub`) the islet's
  beta/alpha/delta cell types (CL:0000169/0171/0173) as candidate CTpop
  (Cell Type Populations, Bueckle 2026) parameterization targets, without
  binding any real count. This study takes that next step for Topp2000
  (BIOMD0000000341, Topp et al. 2000 J Theor Biol): it binds a documented
  HRA-aligned islet beta-cell-fraction (a live CTpop API pull is not
  publicly exposed as JSON as of this writing, so this study uses
  documented literature/HRA-ASCT+B composition values instead, cited in
  `ISLET_COMPOSITION` -- beta 54%, alpha 34%, delta 10%, PP/epsilon ~2%,
  per Cabrera et al. 2006 PNAS and Brissova et al. 2005) onto the Topp
  model's initial beta-cell mass B, via
  `B_init = b_ref * (beta_fraction / 0.54)` where `b_ref` (37, the model's
  own SBML-declared default initial B) is read out of the model, not
  hardcoded. The Topp model is deliberately built to operate on a DAYS
  timescale (beta-cell-mass turnover is slow relative to glucose/insulin
  kinetics), so this study runs it out to 4,000 model-time-units (~11
  years) -- long enough for the model's slow beta-cell-mass compartment to
  reach a new steady state. Running both a healthy islet (54% beta,
  b_init=37, reproducing the model's own default) and a beta-depleted
  islet (30% beta, the T2D-relevant beta-cell loss, b_init~20.6) shows the
  composition binding lands on a real mechanistic knife-edge in this model:
  the healthy islet settles at the model's physiological fixed point
  (glucose ~100 mg/dL, a normal fasting-range value), while the
  beta-depleted islet crosses Topp2000's bifurcation into the pathological
  fixed point (glucose ~600 mg/dL, severe hyperglycemia, with beta-cell
  mass and insulin both collapsing toward zero) -- exactly the "mild vs.
  extreme beta-cell loss" bifurcation behavior the original Topp et al.
  2000 paper describes as its central diabetes-progression finding. So
  binding CTpop composition to this model doesn't just nudge a number, it
  flips which of the model's two stable regimes the trajectory lands in.

readouts:
  - "runs.healthy.{time,B,G,I} / runs.beta_depleted.{time,B,G,I} (Topp2000 trajectories)"
  - "runs.<scenario>.b_init / b_ref / beta_fraction (the CTpop-fraction -> beta-cell-mass binding)"
  - "islet_composition (documented HRA-aligned beta/alpha/delta/PP-epsilon fractions + citations)"
  - "reference_beta_fraction (0.54, the healthy-reference the binding scales against)"

report:
  title: "CTpop -> Topp2000 Islet Parameterization — Beta-Depleted Islet Crosses the Model's Diabetes Bifurcation"
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: measured
  objective: |
    Does binding HRA CTpop islet cell-type composition to the Topp2000
    beta-cell-mass model change its predicted glucose regulation?
  conclusion: |
    Yes, decisively. Binding the documented healthy islet composition
    (54% beta) reproduces the Topp2000 model's own default initial
    beta-cell mass (b_ref=37) exactly and the model settles at its
    physiological fixed point: glucose falls from an initial 250 to
    ~100.0 mg/dL over 4,000 model-days, beta-cell mass grows from 37 to
    ~300, insulin rises from 2.8 to ~10.0. Binding the T2D-relevant
    beta-depleted composition (30% beta, the documented beta-cell loss)
    scales the initial mass down to ~20.56 (37 * 0.30/0.54) and the
    SAME model, run identically, crosses Topp2000's beta-cell-mass
    bifurcation into its pathological fixed point: glucose rises to
    ~600.0 mg/dL (severe hyperglycemia) while beta-cell mass and insulin
    both collapse toward 0. This mechanistically links a real, cited
    HRA-aligned cell-type-composition difference to a qualitatively
    different physiological regime in a real, published beta-cell-mass
    model -- not just a small parameter perturbation, but a flip between
    the model's two documented stable states (Topp et al. 2000's own
    central finding about mild vs. extreme beta-cell loss).
  caveat: |
    `ISLET_COMPOSITION` is documented literature/HRA-ASCT+B composition
    (Cabrera et al. 2006 PNAS; Brissova et al. 2005), not a live HRA CTpop
    API pull for a specific RUI-registered tissue block -- a live query
    would give a real measured composition instead of a population-average
    literature value, and a live CTpop endpoint is not (as of this writing)
    publicly exposed as JSON. The binding is initial-mass-only: only the
    beta fraction enters the model (via B_init), and only as an initial
    condition, not a rate parameter -- alpha/delta fractions are identified
    (`ISLET_COMPOSITION`) but not bound to any Topp2000 parameter (e.g.
    glucagon secretion isn't in this model at all). So
    `pipeline_gate.gate_evaluator.result` is `needs_calibration`.

baseline:
  - name: baseline
    step: local:viva_human_atlas.ctpop_islet.CtpopIsletParameterizationStep
    params:
      model_id: "BIOMD0000000341"
      t_end: 4000.0
      n_points: 200

embed_visualizations:
  - name: "Glucose vs islet composition"
    url: "/reports/figures/ctpop-islet-parameterization/glucose-vs-islet-composition.html"
    description: "Topp2000 glucose G(t) over 4,000 model-days: healthy islet (54% beta) settles at ~100 mg/dL (physiological); beta-depleted islet (30% beta, the T2D-relevant beta-cell loss) crosses the model's bifurcation to ~600 mg/dL (pathological hyperglycemia), beta-cell mass and insulin collapsing toward 0."

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: needs_calibration
  # Downstream of the FTU-model survey (which surfaced the islet models) AND the
  # glucose-regulation base (whose glucose models it parameterizes) — so the
  # investigation graph shows it as a downstream child, not an unlinked seed.
  prerequisites:
    - study: ftu-model-coverage
      relation: leads-to
    - study: glucose-regulation
      relation: leads-to

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Binding the documented healthy islet composition (54% beta) to
      Topp2000's initial beta-cell mass reproduces the model's own default
      (b_ref=37) and the model settles at its physiological fixed point
      (glucose ~100 mg/dL over 4,000 model-days). Binding the documented
      T2D-relevant beta-depleted composition (30% beta) scales the initial
      mass down to ~20.56 and the identical model crosses Topp2000's
      beta-cell-mass bifurcation into its pathological fixed point (glucose
      ~600 mg/dL, beta-cell mass and insulin collapsing toward 0) -- the
      CTpop composition mechanistically shifts which of the model's two
      stable regimes the glucose trajectory lands in, not merely its
      numeric value.
    evidence:
      summary: "healthy (beta=0.54, b_init=37=b_ref): G 250->100.0, B 37->300.0, I 2.8->10.0 (physiological fixed point). beta_depleted (beta=0.30, b_init=20.56): G 250->600.0, B 20.56->~0, I 2.8->~0 (pathological fixed point) -- same model, same 4,000-model-day horizon, differing only in the CTpop-composition-bound initial beta-cell mass."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline ctpop-islet-parameterization composite (CtpopIsletParameterizationStep -> compare_islet_compositions) completed without error for both scenarios, emitting non-empty runs.healthy / runs.beta_depleted trajectories with real BioModels-fetched, tellurium-solved numbers."
  biological_validation:
    basis: "ISLET_COMPOSITION is documented literature/HRA-ASCT+B composition (Cabrera 2006 PNAS; Brissova 2005), not a live HRA CTpop API pull, and the binding is initial-mass-only (alpha/delta fractions identified but not bound to a model parameter), so gated needs_calibration rather than passed -- but the underlying model (BIOMD0000000341) is real and the binding (B_init = b_ref * beta_fraction / 0.54, b_ref read from the SBML) is a defensible, documented, non-hardcoded parameterization."
  explanatory_gain:
    basis: "F-01 directly answers the study question -- yes, binding CTpop islet composition to Topp2000 changes the predicted glucose regulation, and dramatically: it flips which of the model's two stable fixed points (physiological vs. pathological/diabetic) the trajectory settles into, realizing the RUI -> CTpop -> model parameterization vision for a real, covered FTU model rather than merely stubbing which parameters would be involved."

limitations:
  - "`ISLET_COMPOSITION` is documented literature/HRA-ASCT+B composition (Cabrera et al. 2006 PNAS; Brissova et al. 2005), not a live HRA CTpop API pull for a specific RUI-registered tissue block -- a live CTpop endpoint is not (as of this writing) publicly exposed as JSON."
  - "Binding is initial-mass only: only the beta-cell fraction enters the Topp2000 model, and only as the initial condition for B, not as a rate/kinetic parameter -- alpha and delta fractions are identified (`ISLET_COMPOSITION`) but not bound to any Topp2000 parameter (the model has no glucagon/somatostatin compartment to bind them to)."
  - "The 30% beta-depleted scenario is a single illustrative T2D-relevant composition point, not a distribution over real measured islets -- the exact glucose/insulin/beta-mass endpoints (600 / ~0 / ~0) are specific to this one fraction and this one model's parameterization, not a general dose-response curve."

discovery_implications:
  resolved_uncertainties:
    - "CTpop islet composition, bound as an initial-condition parameter (beta-cell mass), does mechanistically change Topp2000's predicted glucose regulation -- realizing (for one covered FTU model and one composition-to-parameter binding) the RUI -> CTpop -> model parameterization vision `ftu-model-coverage`'s `ctpop_parameter_stub` only stubbed."
    - "The composition shift from healthy (54% beta) to T2D-relevant beta-depleted (30% beta) composition is large enough, in this model's parameterization, to cross a real bifurcation between the model's physiological and pathological fixed points -- not just perturb a number within one regime."
  remaining_uncertainties:
    - "Does a LIVE HRA CTpop count (for a specific RUI-registered islet tissue block) differ materially from the documented literature-average composition used here, and if so, in which direction?"
    - "Should alpha/delta cell fractions bind to separate Topp2000-family or extended-model parameters (e.g. a glucagon-secretion term), rather than folding all islet composition information into the single beta-cell-mass initial condition?"
  followup_study_proposals:
    - id: fp-ctpop-live-islet-binding
      title: "Bind a LIVE HRA CTpop islet cell count (not documented literature values) to Topp2000"
      motivation: "This study proves the mechanism (composition -> beta-cell mass -> glucose regime) using documented literature composition; a live per-tissue-block CTpop count would let a specific RUI-registered islet be parameterized against its own measured composition rather than a population average."
      study_type: mechanistic
      proposed_experiment: "When/if a live HRA CTpop JSON endpoint becomes available for a RUI-registered pancreatic-islet tissue block, fetch its real beta/alpha/delta-cell counts, compute the beta fraction from the real counts (not the documented 0.54/0.34/0.10/0.02 split), and re-run `compare_islet_compositions` with that live fraction in place of the documented one."
      expected_information_gain: high
      source_trigger: ctpop-islet-parameterization
    - id: fp-ctpop-multi-parameter-islet-binding
      title: "Bind alpha/delta CTpop fractions to per-cell-type Topp-family model parameters"
      motivation: "This study binds only the beta fraction (to initial beta-cell mass); a fuller CTpop -> model parameterization would also bind alpha/delta fractions to whichever islet-model parameters they mechanistically govern (e.g. a glucagon-secretion-capable extended model)."
      study_type: mechanistic
      proposed_experiment: "Identify or build an islet model with explicit alpha/delta-cell-mediated terms (e.g. glucagon counter-regulation), and bind CTpop alpha/delta fractions to those terms alongside the existing beta -> B binding, then compare against the beta-only binding used here."
      expected_information_gain: medium
      source_trigger: ctpop-islet-parameterization
