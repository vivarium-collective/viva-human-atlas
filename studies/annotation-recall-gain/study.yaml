schema_version: 4
name: annotation-recall-gain
investigation: hra-integration
title: "Annotation Recall Gain — Annotation-Matching vs Name-Only Organ Tagging"
created: '2026-08-01'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  How much organ/model coverage does annotation-based organ matching (SBML
  MIRIAM + BTO crosswalk) add over the existing name-synonym matcher
  (`glucose-biomodel-do`/`corpus-coverage`), across the full 1,096-model
  curated BioModels corpus?

study_card:
  goal: "Run annotation_gain.compare_catalogs over the committed name-synonym catalog (datasets/biomodel_corpus_catalog.json) and the committed annotation catalog (datasets/biomodel_annotation_catalog.json) to quantify the delta in organs and models reached."
  mechanism: "RecallGainStep.update -> load_corpus_catalog(name_catalog_path) x load_corpus_catalog(annotation_catalog_path) -> compare_catalogs(name, annotation) -> per-organ name/annotation/union model counts + delta{organs_added, n_models_added, per_organ} + summary{pct_corpus_tagged_*} -> RAMEmitter."
  expected_result: "Annotation matching reaches materially more models and organs than name-only matching, including organs the name matcher never sees because their reference-organ name never appears verbatim in a BioModels title."
  main_expert_question: "How much organ/model coverage does annotation-matching add over name-only matching?"

biological_summary: |
  Name-synonym matching (`biomodel_do.py`) can only tag a model if its HRA
  reference-organ name (or a synonym) literally appears in the BioModels
  title -- a precise but recall-limited signal, since most model titles
  describe the biological process ("insulin-glucose oscillator") rather
  than naming the organ. Annotation-based matching instead reads the
  model's own curated SBML MIRIAM metadata, which encodes anatomical
  context the title doesn't have to spell out. Organs like lymph node,
  ovary, spleen, and urinary bladder are essentially invisible to name
  matching -- no BioModels title says "spleen" -- but are directly
  annotated in the SBML, so only annotation-based matching reaches them at
  all.

readouts:
  - "gain.name.n_models_total / gain.annotation.n_models_total / gain.union.n_models_total"
  - "gain.name.organs (10) / gain.annotation.organs (14) / gain.union.organs (14)"
  - "gain.delta.organs_added / gain.delta.n_models_added"
  - "gain.summary.pct_corpus_tagged_name / pct_corpus_tagged_annotation"

report:
  title: "Annotation Recall Gain — +85 models, +4 organs over name-only matching"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    How much organ/model coverage does annotation-based matching add over
    name-only matching, across the full 1,096-model corpus?
  conclusion: |
    Name-synonym matching tags 82 models (7.5% of the 1,096-model corpus)
    across 10 organs. Annotation-based matching (SBML MIRIAM + BTO
    crosswalk) tags 114 models (10.4%) across 14 organs. The union of both
    reaches 167 models across 14 organs. Annotation matching adds 85 models
    the name matcher missed entirely, and 4 whole organs the name matcher
    never reaches at all: lymph-node, ovary, spleen, urinary-bladder --
    organs whose names essentially never appear in a BioModels title but
    whose SBML annotations directly name them. Every organ the name matcher
    does reach also gains models under annotation matching (e.g. brain:
    5 -> 26 models, intestine: 2 -> 17, liver: 9 -> 26), so the gain is not
    limited to the 4 newly-reached organs -- annotation matching is a
    strict recall improvement across the board except pancreas, where name
    matching's 36 models exceed annotation's 24 (the union is still larger
    at 47, so annotation still adds new pancreas-tagged models, but not a
    superset of the name matcher's hits).
  caveat: |
    Annotation matching depends entirely on a model actually carrying a
    resolvable MIRIAM CVTerm (Uberon/FMA direct, or BTO through the
    32-entry crosswalk, see `annotation-organ-matching`) -- 985/1,096
    models (89.9%) remain untagged by either matcher, so even the union's
    10.4%+7.5% (partially overlapping) coverage is still a small fraction
    of the full corpus. The two matchers are complementary, not redundant:
    combining them (the union) is the recommended organ->models index for
    downstream multiscale coupling, not either alone.

embed_visualizations:
  - name: "Recall gain — name-only vs annotation-based organ matching"
    url: "/reports/figures/annotation-recall-gain/recall-gain.html"
    description: "Per-organ model counts (name-only vs annotation vs union) across the 1,096-model corpus: annotation matching adds 85 models and 4 whole organs (lymph-node, ovary, spleen, urinary-bladder) that name-only synonym matching misses entirely."

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.annotation_composite.annotation-recall-gain
    params:
      name_catalog_path: "datasets/biomodel_corpus_catalog.json"
      annotation_catalog_path: "datasets/biomodel_annotation_catalog.json"

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Annotation-based organ matching reaches 114/1,096 models (10.4%,
      14 organs) vs name-only matching's 82/1,096 (7.5%, 10 organs) over
      the same 1,096-model corpus, adding 85 models and 4 whole organs
      (lymph-node, ovary, spleen, urinary-bladder) the name matcher cannot
      reach because those organ names never appear verbatim in a BioModels
      title -- confirming annotation-based matching is a materially
      higher-recall complement to, not merely a duplicate of, name-synonym
      matching.
    evidence:
      summary: "name: 82 models/10 organs (7.5%); annotation: 114 models/14 organs (10.4%); union: 167 models/14 organs; delta: +85 models, organs_added=[lymph-node, ovary-female-left, spleen, urinary-bladder]."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline recall-gain composite (compare_catalogs over both committed catalogs) completed without error."
  biological_validation:
    basis: "The 4 newly-reached organs (lymph-node, ovary, spleen, urinary-bladder) are biologically plausible SBML-annotation-only gains -- organs rarely named in a model title but directly encoded in curated MIRIAM/BTO metadata -- and every name-matched organ except pancreas also gains models under annotation matching, consistent with annotation matching reading richer per-model metadata than a title string."
  explanatory_gain:
    basis: "F-01 quantifies, for the first time, exactly how much of the name-only matcher's recall ceiling (glucose-biomodel-do's central open question) SBML-annotation-based matching closes: +85 models, +4 organs, union coverage of 167/1,096 (15.2%) vs either matcher alone."

limitations:
  - "985/1,096 models (89.9%) remain untagged by either matcher combined -- the union closes real ground but is still a small fraction of the full corpus."
  - "Pancreas is the one organ where name-only matching (36 models) outnumbers annotation matching (24 models) individually, though the union (47) still exceeds either -- the two mechanisms are complementary, not strictly ordered."

discovery_implications:
  resolved_uncertainties:
    - "SBML MIRIAM/BTO annotation-based matching materially raises organ-tagging recall over name-only synonym matching (+85 models, +4 organs), directly answering glucose-biomodel-do's followup proposal fp-sbml-annotation-tagging."
  remaining_uncertainties:
    - "Would a combined name+annotation matcher (the union index) change conclusions in downstream studies that currently key off the name-only organ_to_models index (model-coverage-3d, corpus-coverage)?"
  followup_study_proposals:
    - id: fp-union-organ-index
      title: "Union organ->models index for downstream coverage studies"
      motivation: "model-coverage-3d and corpus-coverage currently key off the name-only organ_to_models index; re-running them against the union (name + annotation) index would widen their AS-node/organ-GLB coverage numbers using the same crosswalk machinery."
      study_type: method-upgrade
      proposed_experiment: "Re-run CoverageStep with a catalog built from the union of the name-synonym and annotation catalogs' organ_to_models indices, and compare AS-node/organ-GLB coverage against the current corpus-coverage baseline (635/1,730 AS nodes, 31/114 organs)."
      expected_information_gain: high
      source_trigger: annotation-recall-gain
