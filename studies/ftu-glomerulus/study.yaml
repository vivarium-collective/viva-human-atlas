schema_version: 4
name: ftu-glomerulus
investigation: hra-3d
title: "FTU Glomerulus — 3D Functional-Tissue-Unit Digital Object"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Does the HRA CDN's glomerulus 3D functional-tissue-unit (FTU) digital
  object load into a Step-driven composite, giving a sub-organ-scale 3D
  asset (below the per-organ reference-organ GLBs) that could anchor
  finer-grained model coverage?

study_card:
  goal: "Fetch the glomerulus FTU digital object via HRAFtuStep and confirm the composite loads a non-empty ftu record with a resolvable GLB asset URL."
  mechanism: "HRAFtuStep.update -> fetch_ftu(slug='glomerulus') -> HRA CDN 3d-ftu/glomerulus digital object -> {slug, title, description, glb, glb_url} -> one store -> RAMEmitter."
  expected_result: "The glomerulus FTU record loads with a non-empty title/description and a glb_url pointing at the CDN's 3d-ftu/glomerulus/latest/assets/ directory."
  main_expert_question: "Are enough FTUs (beyond glomerulus) published at this digital-object shape to generalize sub-organ-scale model coverage, or is glomerulus a one-off?"

biological_summary: |
  The glomerulus is the kidney nephron's filtration unit — capillary tuft
  plus Bowman's capsule — far smaller than the whole-kidney reference-organ
  GLB the HRA otherwise publishes. HRA's 3D functional-tissue-unit (FTU)
  digital objects capture this sub-organ scale directly, which matters for
  DynXR-style spatially-grounded modeling: a mechanistic model of
  glomerular filtration should anchor to the glomerulus FTU mesh, not just
  a "kidney" whole-organ label. This study confirms that digital object is
  live-fetchable and asks whether the shape generalizes beyond this one FTU.

readouts:
  - "ftu.title / ftu.description non-empty"
  - "ftu.glb_url resolves under the 3d-ftu/glomerulus CDN path"

report:
  title: "FTU Glomerulus — digital object loads (v1.0, ~143 MB GLB)"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    Does the HRA CDN's glomerulus 3D FTU digital object load into a
    Step-driven composite, giving a sub-organ-scale 3D asset with a
    resolvable GLB asset URL?
  conclusion: |
    The live composite loads the glomerulus FTU record: title "glomerulus
    (v1.0) graph data", description "The graph representation of the 3D
    Glomerulus Functional Tissue Unit (FTU) dataset", version v1.0
    (published 2026-06-08 by HuBMAP, CC BY 4.0), resolving to
    `glomerulus.glb` at
    `cdn.humanatlas.io/digital-objects/3d-ftu/glomerulus/latest/assets/glomerulus.glb`
    — confirmed live (HTTP 200, ~150.4 MB / ~143.4 MiB). The FTU digital-object
    shape (`{data:[glb], metadata:{title, description, version, ...}}`)
    parses cleanly into the expected `ftu` record.
  caveat: |
    The HRA CCF resolver (`purl.humanatlas.io/3d-ftu/<slug>/latest`) 404s
    on a bare `Accept: */*` request and only 200s with an explicit
    `Accept: application/json` header — an upstream content-negotiation
    quirk, not a data-shape problem; `hra_api.fetch_ftu` was updated to
    send that header so the live fetch actually resolves (previously this
    composite would fail end-to-end against the current live API). Only
    one FTU (glomerulus) is exercised here — whether the HRA has published
    others at this same digital-object shape (the study's main expert
    question) is not yet checked.

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.hra_steps.ftu-glomerulus
    params:
      slug: "glomerulus"

embed_visualizations:
  - name: "Glomerulus FTU metadata"
    url: "/reports/figures/ftu-glomerulus/ftu-metadata.html"
    description: "Info table of the live-fetched glomerulus FTU digital-object fields (slug, title, description, glb, glb_url)."

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The glomerulus 3D FTU digital object loads live: title "glomerulus
      (v1.0) graph data", version v1.0 (HuBMAP, CC BY 4.0), resolving to a
      real, confirmed-live (HTTP 200) glb_url of ~150.4 MB -- confirming the
      sub-organ-scale FTU digital-object shape is real and fetchable, a
      prerequisite for anchoring finer-than-whole-organ model coverage.
    evidence:
      summary: "ftu record loads with non-empty title/description/version; glb_url resolves HTTP 200 at ~150.4 MB (~143.4 MiB); required an Accept:application/json header fix to the client for the live CCF resolver to 200 rather than 404."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline live fetch of the glomerulus FTU digital object completed without error (after the Accept-header fix)."
  biological_validation:
    basis: "The endpoint returns the expected digital-object shape/data -- title, description, version, and a resolving GLB asset confirmed live (HTTP 200, ~150.4 MB)."
  explanatory_gain:
    basis: "F-01 establishes the sub-organ-scale FTU digital-object shape is real and fetchable, directly bearing on whether sub-organ-scale model coverage can generalize beyond whole-organ granularity."

limitations:
  - "Only one FTU (glomerulus) is exercised here; whether HRA has published others at this same digital-object shape (the study's main expert question) is not yet checked."
  - "The HRA CCF resolver 404s on a bare Accept:*/* request and only 200s with an explicit Accept:application/json header -- an upstream content-negotiation quirk that required a client fix."

discovery_implications:
  resolved_uncertainties:
    - "The glomerulus FTU digital object is live, correctly shaped, and resolves to a real GLB asset (after the Accept-header fix)."
  remaining_uncertainties:
    - "Are enough FTUs beyond glomerulus published at this same digital-object shape to generalize sub-organ-scale model coverage?"
  followup_study_proposals:
    - id: fp-ftu-scale-coverage
      title: "FTU-scale model coverage"
      motivation: "Extend model coverage from whole-organ GLBs down to functional tissue units (glomerulus + other published FTUs) so sub-organ models can be anchored."
      study_type: analysis
      proposed_experiment: "Fetch every published HRA FTU digital object (not just glomerulus), cross their sub-organ anatomical structures against the biomodel-DO organ->models index, and report coverage at FTU granularity alongside the existing organ-granularity figures."
      expected_information_gain: medium
      source_trigger: ftu-glomerulus
