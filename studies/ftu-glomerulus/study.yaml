- expectation: The HRA publishes sub-organ functional tissue units (e.g. the glomerulus) as 3D digital objects below whole-organ granularity.
  model_observable: ftu record + resolvable glb_url for slug=glomerulus
  source: HRA functional tissue units
  status_in_workspace: 'confirmed: glomerulus FTU v1.0 loads, GLB resolves HTTP 200'
