schema_version: 4
name: hra-cell-types
title: "HRA Cell-Type Term Occurrences"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Does the HRA CCF API's cell-type-term-occurences endpoint load into a
  Step-driven composite, giving a Cell Ontology (CL) term occurrence list?

study_card:
  goal: "Fetch HRA cell-type term occurrences via HRACellTypesStep and confirm the composite loads a non-empty, count-sorted CL term list."
  mechanism: "HRACellTypesStep.update -> fetch_cell_type_terms(HRA_API) -> one store -> RAMEmitter."
  expected_result: "Cell Ontology terms load as CURIEs sorted by occurrence count descending."
  main_expert_question: "Which CL terms dominate the HRA corpus, and do they align with the organs we care about for glucose regulation (pancreas, liver, adipose, muscle)?"

biological_summary: |
  The HRA's cell-type-term-occurrence histogram counts, across every HRA
  dataset (tissue block, single-cell, spatial), how often each Cell
  Ontology (CL) term is annotated on a cell population. A term's occurrence
  count is a proxy for how broadly that cell type has been profiled across
  organs/datasets, not for its abundance in the body — a near-universal
  term (e.g. an ontology root) will out-rank a rare-but-important cell type
  like a pancreatic beta cell simply because it is annotated on almost
  every dataset.

report:
  title: "HRA Cell Types — 149 distinct CL terms loaded, top term at 2,762 occurrences"
  verdict: passing
  confidence: high
  evidence_quality: measured
  objective: |
    Does the HRA CCF API's cell-type-term-occurences endpoint load into a
    Step-driven composite, giving a Cell Ontology (CL) term occurrence
    list?
  conclusion: |
    A live run against
    `https://apps.humanatlas.io/api/v1/cell-type-term-occurences` returned
    149 distinct CL terms, sorted by occurrence count descending. The top
    term (CL:0000000) occurs 2,762 times — an order of magnitude above the
    #2-#9 tier, which cluster at exactly 266 occurrences each (CL:0010008,
    CL:0000084, CL:0000236, CL:0000576, CL:0000623, CL:0011005, CL:4023011,
    CL:4023016), suggesting those co-occur as a fixed per-record annotation
    bundle in whatever HRA datasets contribute them.
  caveat: |
    The dominant top term (2,762 occurrences, ~4x the next tier) reads as a
    broad/root-level CL annotation rather than a specific, glucose-relevant
    cell type — this endpoint answers "which CL terms are most annotated
    across HRA datasets", not "which cell types matter most for glucose
    regulation" (pancreatic beta cells, hepatocytes, adipocytes do not
    appear in the top 10 by this measure).

readouts:
  - "count of distinct CL terms loaded"
  - "top-N CL terms by occurrence count"

embed_visualizations:
  - name: "Top cell-type (CL) terms by occurrence count"
    url: "/reports/figures/hra-cell-types/top-cell-types.html"
    description: "Bar chart of the top 15 of 149 loaded CL terms by HRA occurrence count; the top term (CL:0000000) occurs 2,762 times, ~4x the next tier."

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.hra_steps.hra-cell-types
    params:
      base_url: "https://apps.humanatlas.io/api"

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The HRA cell-type-term-occurences endpoint returns 149 distinct Cell
      Ontology (CL) terms, count-sorted; the top term (CL:0000000) occurs
      2,762 times, an order of magnitude above an 8-term tier that clusters
      at exactly 266 occurrences each -- consistent with those terms
      co-occurring as a fixed per-record annotation bundle in whatever HRA
      datasets contribute them.
    evidence:
      summary: "149 distinct CL terms loaded; top term CL:0000000 at 2,762 occurrences; 8 terms tied at exactly 266 occurrences each."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline live fetch against the HRA CCF cell-type-term-occurences endpoint completed without error."
  biological_validation:
    basis: "The endpoint returns the expected data shape and counts: 149 CL terms sorted by occurrence count descending, matching the live HRA corpus."
  explanatory_gain:
    basis: "F-01 identifies the top term as a broad/root-level CL annotation, not a glucose-relevant cell type, answering 'which terms are most annotated' rather than 'which cell types matter most for glucose regulation'."

limitations:
  - "Occurrence count is a proxy for dataset-annotation breadth, not cell abundance in the body or physiological relevance to glucose regulation; pancreatic beta cells, hepatocytes, and adipocytes do not appear in the top 10 by this measure."

discovery_implications:
  resolved_uncertainties:
    - "149 distinct CL terms load cleanly, count-sorted, confirming the endpoint's shape is stable and non-empty."
  remaining_uncertainties:
    - "Do any of the 149 terms map to glucose-relevant cell types (beta cells, hepatocytes, adipocytes) further down the occurrence list, and should the study re-rank by relevance rather than raw occurrence?"
  followup_study_proposals:
    - id: fp-cell-type-coverage
      title: "Cell-type (CL) model coverage"
      motivation: "Determine which BioModels represent which HRA cell types (CL terms) via SBML species annotations — extend coverage from organs to cell types."
      study_type: analysis
      proposed_experiment: "Parse SBML species/compartment MIRIAM annotations for Cell Ontology (CL) terms across the curated BioModels corpus, cross them against the 149 HRA cell-type term occurrences, and report a cell-type->models index alongside the existing organ-granularity coverage."
      expected_information_gain: high
      source_trigger: hra-cell-types
