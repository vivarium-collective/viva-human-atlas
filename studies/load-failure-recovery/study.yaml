schema_version: 4
name: load-failure-recovery
title: "Load-Failure Recovery — Auto-Generating Default SED-ML (Planned)"
created: '2026-07-26'
status: planned
design_status: not-started
implementation_status: not-started
simulation_status: pending
phase: Design

question: |
  Can a default UTC (uniform time-course) SED-ML simulation protocol be
  auto-generated for BioModels entries that fail to load with
  "could not find a .sedml file in entry", recovering the 4/5 models this
  investigation's own glucose-regulation run could not load in either
  engine?

study_card:
  goal: "For each MODEL* entry that fails with 'could not find a .sedml file', auto-generate a minimal uniform-time-course SED-ML wrapper (default duration/steps inferred from the SBML's own units) and re-attempt the COPASI/Tellurium load+compare."
  mechanism: "Planned: a SED-ML-synthesis Step that inspects a failing entry's raw SBML (time units, existing rate constants) to infer a plausible UTC duration/step count, writes a minimal SED-ML wrapper, and re-runs the same load+compare path glucose_regulation's composite already uses (LoadBiomodelStep + per-engine UTC + all-pairs nRMSE)."
  expected_result: "At least some of the 4/5 models that failed in this investigation's live run (MODEL2001080002, MODEL1112110004, MODEL1806080001, MODEL2005050001) load successfully under both engines once a synthesized SED-ML is attached, expanding the COPASI-vs-Tellurium agreement sample beyond n=1."
  main_expert_question: "Is an auto-generated default simulation protocol (arbitrary duration/step count, not the model author's intended experimental design) scientifically meaningful to compare against, or does it only demonstrate loadability without a trustworthy dynamics comparison?"
  future_work: "The real SED-ML-synthesis mechanism is not yet implemented. This scaffold's baseline placeholder reuses the existing glucose_regulation composite (which is what currently fails on these 4/5 models) purely so the study resolves and renders; the auto-generation/recovery step itself is future work."

biological_summary: |
  glucose-regulation's live 5-model run loaded only 1/5 models
  (BIOMD0000000633, Bulik2016 hepatic glucose metabolism) successfully
  under both COPASI and Tellurium; the other 4 — all non-curated `MODEL*`
  BioModels preprint entries (Topp2000 beta-cell mass, Silber2007
  IV-glucose, and two others) — failed identically with
  "ValueError: could not find a .sedml file in entry". This is a load-time
  packaging gap, not a numerical disagreement: the SBML itself is present
  and biologically well-formed (these are recognizable
  beta-cell/insulin-glucose models), but no SED-ML simulation protocol
  (start/end time, step count, which species to record) ships with the
  entry, so neither engine's UTC runner has anything to execute. Recovering
  these models — by synthesizing a reasonable default UTC protocol from the
  SBML's own units rather than requiring a hand-authored SED-ML — would
  directly raise this investigation's load-success rate and let the
  COPASI-vs-Tellurium agreement statistic generalize beyond a single model.

pipeline_gate:
  prerequisites:
    - study: glucose-regulation
      relation: leads-to

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.glucose_regulation.glucose-regulation
    params:
      query: "glucose regulation"
      max_results: 10
      simulators: "copasi,tellurium"

