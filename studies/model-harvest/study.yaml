schema_version: 4
name: model-harvest
investigation: hra-integration
title: "Unified Model Harvest — BioModels + PhysioNet into the HRA Model DB"
created: '2026-08-07'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Can a single Step reproduce/refresh the unified HRA model DB
  (datasets/model_hra_map.json) across every registered model source --
  BioModels and, newly, PhysioNet -- incrementally and non-destructively, so
  that running this study *is* the reproducibility hook for the whole DB,
  not just a read of a static file?

study_card:
  goal: "Expose viva_human_atlas.model_harvest.ModelHarvestStep as the model-harvest study's baseline: load (or, when asked, refresh) datasets/model_hra_map.json across the biomodels + physionet source registry and report total + per-source model counts plus the corpus coverage summary, so that running this study is how the unified DB gets reproduced or incrementally refreshed."
  mechanism: "ModelHarvestStep.update -> model_harvest.harvest: for each named source (biomodels, physionet) in the SOURCES registry, list_fn enumerates candidate items (BioModels search / PhysioNet DataCite DOI enumeration under the shared 10.13026 prefix), should_process(db, identifier, force) skips anything already keyed in the DB unless --force, and entry_fn upserts a per-source entry keyed by a stable identifier (BioModels IRI, PhysioNet content URL) -- so a plain rerun only harvests newly-posted models and a source refresh never touches another source's rows. PhysioNet entries are organ-mapped by physionet_organ_map.map_project_to_organs: a curated physiology-keyword -> UBERON table first (deterministic, offline), falling back to an LLM (claude-haiku-4-5) for the unmapped tail, both bound to HRA organs through the same hra_mapping.map_to_hra the BioModels path uses. With build_if_missing: false (this study's baseline), no network calls happen at all -- the Step just loads the committed DB via biomodel_hra.load_map and reports bh.summarize_map's coverage stats, so the study is network-free by default and only reaches out when explicitly told to refresh. scripts/harvest_models.py (the reproducible-refresh CLI) calls the exact same harvest() function, so the Step and the CLI cannot diverge."
  expected_result: "With build_if_missing: false, the baseline loads whatever is currently committed to datasets/model_hra_map.json and reports it verbatim: as of this study's authoring the committed DB predates the PhysioNet source and so is BioModels-only (1,096 models, all repository=biomodels, 0 physionet). Running the harvest for real (build_if_missing/force: true, a separate operational step, not this study's default baseline) is expected to preserve every existing BioModels row untouched and add PhysioNet rows alongside them, incrementally upserted by identifier -- the exact PhysioNet count is not yet known and will be reported per-repository (per_source.physionet) once that harvest runs, not asserted here."
  main_expert_question: "Is loading the committed DB network-free (build_if_missing: false) the right default baseline for a study whose whole point is reproducibility -- or should the baseline itself force a live refresh each run, at the cost of losing the network-free guarantee that keeps offline CI green?"

biological_summary: |
  BioModels and PhysioNet are curated from different angles -- BioModels
  publishes quantitative systems-biology models (SBML/BioPAX, annotated for
  biochemistry), PhysioNet publishes physiological signal/waveform datasets
  and their companion models (ECG, EEG, respiratory, gait, and more) -- but
  both describe things that live in a human organ, so both belong in the same
  HRA-linked model DB. `model_harvest.harvest` treats them as interchangeable
  entries in one source registry: each source contributes a `list_fn` (how to
  enumerate its catalog -- BioModels search vs. PhysioNet's DataCite DOI
  enumeration under the shared `10.13026` prefix) and an `entry_fn` (how to
  build one DB row, including its HRA organ mapping), and `harvest()` upserts
  every source's rows into the same `datasets/model_hra_map.json` keyed by a
  stable per-source identifier. That keying is what makes the harvest
  incremental and non-destructive: rerunning it only touches models new since
  the last pass, and refreshing one source (say, adding PhysioNet for the
  first time) can never overwrite or drop another source's rows. This study's
  baseline is the `ModelHarvestStep` wired to both sources with
  `build_if_missing: false`, so by default it just loads and reports whatever
  is already committed -- the network-free, reproducible read every other
  study and the Atlas Browser can depend on. Running it with a refresh flag
  is the same Step actually doing the harvest: the mechanism this study
  exercises is exactly the one that produced (and will keep extending)
  `datasets/model_hra_map.json`.

readouts:
  - "n_models (total rows in datasets/model_hra_map.json across every registered source)"
  - "per_source.{biomodels,physionet} (row count contributed by each source, from a Counter over the repository field)"
  - "summary.{n_with_molecular,n_with_uberon,n_with_hrapop,coverage} (unchanged corpus-coverage stats from biomodel_hra.summarize_map, unaffected by which sources are loaded)"
  - "db_path (the committed dataset path the Step loaded, confirming the reproducibility hook points at the real file)"

baseline:
  - name: baseline
    step: "local:viva_human_atlas.model_harvest.ModelHarvestStep"
    params:
      db_path: datasets/model_hra_map.json
      sources: [biomodels, physionet]
      build_if_missing: false

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed
  # This study is the reproducibility hook the whole unified DB depends on:
  # biomodel-hra-map produced the BioModels-only DB this Step now loads
  # source-generically, and PhysioNet is registered as a second source ready
  # to upsert into the same file the moment a refresh runs.
  prerequisites:
    - study: biomodel-hra-map
      relation: leads-to

findings:
  - id: F-01
    tier: measurement
    mechanism_origin: observed
    claim_scope: mechanism
    statement: |
      The baseline (build_if_missing: false) loads the committed
      datasets/model_hra_map.json network-free through the two-source
      registry and reports it exactly as stored: 1,096 models, all
      repository=biomodels (0 physionet), because the committed DB predates
      the PhysioNet source. The corpus-coverage summary is byte-for-byte the
      same as biomodel-hra-map's (n_with_molecular=978, n_with_uberon=323,
      n_with_hrapop=112), confirming the ModelHarvestStep's load path is a
      pure superset wrapper over the existing BioModels DB, not a
      reinterpretation of it.
    evidence:
      summary: "n_models=1096, per_source={'biomodels': 1096}. summary.n_with_molecular=978, n_with_uberon=323, n_with_hrapop=112 -- identical to biomodel-hra-map's measured coverage, confirming ModelHarvestStep changes nothing about existing rows."
  - id: F-02
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The harvest is source-registry-driven and identifier-keyed, so it is
      structurally incremental and non-destructive: should_process skips
      anything already in the DB (a plain rerun only fetches newly-posted
      models), and each source's entry_fn only ever upserts its own rows
      under its own identifier scheme (BioModels IRIs vs. PhysioNet content
      URLs), so a PhysioNet refresh cannot touch a BioModels row and vice
      versa. That is what lets this one study stand in for "refresh the
      whole unified DB" rather than needing a separate study per source.
    evidence:
      summary: "SOURCES registry has 2 entries (biomodels, physionet), each with an independent list_fn/entry_fn/id_of; harvest() calls should_process(db, ident, force) before every upsert, keyed by the source's own identifier scheme, so cross-source overwrites are structurally impossible."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline ModelHarvestStep loads the committed datasets/model_hra_map.json network-free (build_if_missing: false) and emits n_models=1096 with a non-empty per_source and coverage summary; scripts/harvest_models.py (the reproducible-refresh CLI) calls the exact same model_harvest.harvest() function, so the Step and the CLI cannot diverge."
  biological_validation:
    basis: "The BioModels-only current state is not evaluated for biological correctness here -- that was biomodel-hra-map's job, and this Step reproduces it unchanged (F-01). What this study validates is mechanism: the source registry is generic (each source only needs list_fn/entry_fn/id_of) and the identifier-keyed upsert is provably non-destructive across sources (F-02), which is the property PhysioNet integration depends on."
  explanatory_gain:
    basis: "F-01/F-02 establish, before any PhysioNet row exists in the committed DB, exactly what will and won't change when the harvest is next run for real: BioModels rows are untouched, PhysioNet rows get added incrementally, and the coverage summary mechanism is unaffected by which sources are present -- so Task 9's harvest run has a precise, falsifiable baseline to diff against."

limitations:
  - "The committed datasets/model_hra_map.json has not yet had a PhysioNet harvest run against it, so this study's real per_source.physionet count is currently 0 and is not asserted here (build_if_missing: false intentionally never fetches it) -- the actual count is deferred to the harvest run and will be reported once it happens, not fabricated in this study."
  - "build_if_missing: false means this baseline never exercises the live PhysioNet DataCite enumeration or the keyword/LLM organ-mapping fallback path at all; those are only exercised when the Step (or the CLI) is run with a refresh flag, which is a separate, explicit operation from this study's default baseline."

discovery_implications:
  resolved_uncertainties:
    - "A single Step (ModelHarvestStep) can front a multi-source registry (biomodels, physionet) and load the unified DB network-free by default, with the same underlying harvest() function backing the reproducible-refresh CLI -- Step and CLI cannot diverge."
    - "The upsert mechanism is identifier-keyed per source, so it is structurally provable (not just claimed) that a PhysioNet harvest cannot overwrite or drop a BioModels row, and vice versa."
  remaining_uncertainties:
    - "How many PhysioNet projects will actually resolve to an HRA organ once the harvest runs for real, and how much of that resolution will come from the curated keyword table vs. the LLM fallback? (Task 9.)"
    - "Once PhysioNet rows exist, will the corpus-coverage summary (mesh/uniprot/chebi/kegg -- all BioModels-specific annotation types) need a PhysioNet-appropriate analogue, or does it stay meaningfully BioModels-only?"
  followup_study_proposals:
    - id: fp-physionet-harvest-run
      title: "Run the PhysioNet harvest for real and measure per-source + organ-mapping coverage"
      motivation: "This study establishes the mechanism and the pre-harvest baseline (0 PhysioNet rows); the natural next step is to actually run the harvest (build_if_missing/force: true) and measure what PhysioNet contributes -- row count, organ coverage, and the keyword-vs-LLM split in physionet_organ_map."
      study_type: data-pipeline
      proposed_experiment: "Run model_harvest.harvest(['physionet']) against datasets/model_hra_map.json, then report per_source.physionet, the resulting organ_to_models coverage for PhysioNet-only rows, and what fraction of organ resolutions came from KEYWORD_TO_ORGAN vs. the LLM fallback."
      expected_information_gain: high
      source_trigger: model-harvest
