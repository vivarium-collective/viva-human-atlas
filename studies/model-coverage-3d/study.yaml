schema_version: 4
name: model-coverage-3d
investigation: hra-3d
title: "Model Coverage 3D — AS/Organ Coverage from BioModel-DO Annotations"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Of the HRA ASCT+B-3D crosswalk's 1,400+ anatomical structures (and ~81
  reference organs), which are covered by a mechanistic model — and can
  that coverage be viewed directly on the 3D anatomy?

study_card:
  goal: "Cross the ASCT+B-3D crosswalk's anatomical structures with the biomodel-DO organ->models index, at organ granularity, and confirm the composite loads a non-empty per-AS coverage list plus summary counts."
  mechanism: "CoverageStep.update -> build_coverage(query, max_results) = build_biomodel_do_catalog(...) x fetch_crosswalk(...) -> per-AS `covered` flag (own Uberon has models, or its organ_glb belongs to a covered organ) -> coverage + coverage_summary -> RAMEmitter."
  expected_result: "A non-empty coverage list where at least one anatomical structure/organ is covered by the glucose-regulation biomodel-DO set (pancreas/kidney/liver expected to dominate)."
  main_expert_question: "Is organ-granularity coverage (propagating from a reference organ's Uberon to every AS node cut from its GLB) a meaningful enough proxy for 'this anatomy is modeled', or does it overstate coverage for fine-grained AS nodes with no direct model evidence?"

biological_summary: |
  Glucose regulation is a whole-body, multi-organ circuit: the liver
  buffers glucose via glycogen synthesis/breakdown, the pancreatic islets
  set the hormonal signal (insulin/glucagon) that drives that buffering,
  and the kidney contributes via gluconeogenesis and glucose reabsorption.
  A BioModels search for "glucose regulation" surfaces the mechanistic
  models literature has built for this circuit, and this study asks how
  much of the HRA's fine-grained 3D anatomy those models actually touch
  once their organ annotations are crossed with the ASCT+B-3D crosswalk —
  the query-scoped companion to `corpus-coverage`'s full-catalog sweep.

readouts:
  - "coverage_summary.n_as / n_as_covered (anatomical-structure-node granularity)"
  - "coverage_summary.n_organs_glb / n_organs_glb_covered (source-organ-GLB granularity)"
  - "per-AS covered flag + n_models/model_ids in the coverage list"

report:
  title: "Model Coverage 3D — glucose-regulation query covers liver + pancreas only"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    Of the HRA ASCT+B-3D crosswalk's anatomical structures, which are
    covered by the glucose-regulation BioModels search set (25 results),
    and can that coverage be viewed on the 3D anatomy?
  conclusion: |
    Crossing the 25-result "glucose regulation" biomodel-DO catalog against
    the 1,730-Uberon-row crosswalk marks 58/1,730 AS nodes covered (3.4%),
    all propagating from 4 of 114 source-organ GLBs: `VH_F_Liver`,
    `VH_M_Liver`, `VH_F_Pancreas`, `VH_M_Pancreas` (both sexes of liver and
    pancreas). No kidney coverage at this query scope — organ-granularity
    coverage is exactly as broad as the underlying BioModels search/organ
    annotation, confirming the propagation rule fires correctly (liver and
    pancreas AS nodes light up, nothing else does) rather than overstating
    coverage.
  caveat: |
    Coverage here is bounded by the 25-result query scope, not model
    availability — the full 1,096-model corpus covers far more (see
    `corpus-coverage`: 635/1,730 AS nodes, 31/114 organs, including
    kidney). Organ-granularity propagation also still overstates
    fine-grained coverage: a covered organ's Uberon marks every AS node
    cut from its GLB, not just nodes with direct model evidence.
    NOTE: the embedded 3D viewer packs under this study's `viz/hra/` are
    rendered from the FULL-CORPUS coverage (635/1,730, kidney included),
    NOT this study's glucose-query baseline — so the 3D organs show more
    green than the 58/1,730 figure above. See the `corpus-coverage` study
    for the matching corpus report.

baseline:
  - name: baseline
    step: local:viva_human_atlas.coverage.CoverageStep
    params:
      query: "glucose regulation"
      max_results: 25

embed_visualizations:
  - name: "Coverage per organ (glucose-regulation query)"
    url: "/reports/figures/model-coverage-3d/coverage-per-organ.html"
    description: "Bar chart of models-per-organ from the glucose-regulation query's coverage crossing: 58/1,730 AS nodes covered, concentrated in liver + pancreas (4/114 organ GLBs)."

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: needs_calibration

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Crossing the 25-result "glucose regulation" biomodel-DO catalog
      against the 1,730-Uberon-row crosswalk marks 58/1,730 AS nodes
      covered (3.4%), all propagating from exactly the 4 source-organ GLBs
      whose Uberon is organ-tagged by the underlying catalog (liver +
      pancreas, both sexes) -- confirming the organ-granularity propagation
      rule fires correctly rather than overstating coverage at this scope.
    evidence:
      summary: "58/1,730 AS nodes covered (3.4%), 4/114 organ GLBs (VH_F_Liver, VH_M_Liver, VH_F_Pancreas, VH_M_Pancreas); no kidney coverage at this query scope."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline coverage-crossing composite (25-result query x crosswalk) completed without error."
  biological_validation:
    basis: "Coverage is organ-granularity, name-based propagation from a 25-result query, not calibrated per-AS-node model evidence -- real (liver+pancreas light up exactly where the underlying catalog is organ-tagged, nothing else does) but recall-limited to this query's scope, so gated needs_calibration rather than passed."
  explanatory_gain:
    basis: "F-01 confirms the propagation rule is correct at this scope, but organ-granularity still overstates fine-grained coverage (a covered organ's Uberon marks every AS node cut from its GLB, not just nodes with direct model evidence) -- the study's central caveat."

limitations:
  - "Coverage here is bounded by the 25-result query scope, not model availability -- the full 1,096-model corpus covers far more (see corpus-coverage: 635/1,730 AS nodes, 31/114 organs, including kidney)."
  - "Organ-granularity propagation overstates fine-grained coverage: a covered organ's Uberon marks every AS node cut from its GLB, not just nodes with direct model evidence."

discovery_implications:
  resolved_uncertainties:
    - "The organ-granularity propagation rule is verified correct at this scope: coverage is exactly as broad as the underlying organ annotation (liver+pancreas), not artificially inflated."
  remaining_uncertainties:
    - "Does full-corpus retrieval reach organs this query misses (kidney)? See corpus-coverage."
    - "Does organ-granularity propagation overstate coverage for fine AS nodes with no direct model evidence?"
  followup_study_proposals:
    - id: fp-as-level-coverage
      title: "AS-level (sub-organ) model coverage"
      motivation: "Annotate models to specific anatomical structures (not just whole organs) so coverage reflects direct per-AS evidence rather than organ-granularity propagation."
      study_type: method-upgrade
      proposed_experiment: "Parse SBML MIRIAM/Uberon annotations at the anatomical-structure level (not just organ-name synonym matching) for the biomodel-DO catalog, cross the result directly against crosswalk AS nodes, and compare AS-level covered counts against the current organ-granularity-propagated coverage to quantify the overstatement."
      expected_information_gain: high
      source_trigger: model-coverage-3d
