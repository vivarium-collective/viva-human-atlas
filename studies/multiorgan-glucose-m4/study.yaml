schema_version: 4
name: multiorgan-glucose-m4
title: "Multi-Organ Glucose Homeostasis (M4/Herrgårdh) — Coupled Aim-2 Demo (Planned)"
created: '2026-07-26'
status: planned
design_status: not-started
implementation_status: not-started
simulation_status: pending
phase: Design

question: |
  Can the M4/Herrgårdh multi-organ (liver-pancreas-periphery) glucose
  homeostasis model be imported and wired into a viva-human-atlas
  composite, and do its organ-level fluxes stay consistent with the
  single-organ BioModels already catalogued (Bulik2016 hepatic glucose
  metabolism, Topp/Silber/Sturis/Tolic pancreatic beta-cell models)?

study_card:
  goal: "Wire the M4/Herrgårdh multi-organ (liver-pancreas-periphery) glucose model into a viva-human-atlas composite and run it as a coupled demo, comparing organ-level fluxes against the single-organ models already catalogued here."
  mechanism: "Planned: an M4/Herrgårdh model-import Step (load its published SBML/parameter set) wired into a new composite alongside the existing glucose_regulation composite's COPASI/Tellurium comparison harness, so organ-level flux outputs (hepatic glucose output, pancreatic insulin secretion, peripheral glucose uptake) can be read out per organ compartment and compared against the single-organ models this investigation already catalogued."
  expected_result: "The coupled model's per-organ flux signs and rough magnitudes (e.g. liver net glucose output during fasting, pancreatic insulin secretion rising with glucose) are directionally consistent with the single-organ models' known behavior, demonstrating a genuine coupled multi-organ Aim-2 demo rather than a repeat of single-SBML comparison."
  main_expert_question: "Does treating liver/pancreas/periphery as coupled compartments in one model change the qualitative dynamics (e.g. oscillation period, steady-state glucose) relative to running the single-organ models independently, and is that difference biologically meaningful or a modeling artifact?"
  future_work: "The real M4/Herrgårdh import and multi-organ composite is not yet implemented. This scaffold's baseline placeholder reuses the existing glucose_regulation composite (single-query COPASI/Tellurium comparison) purely so the study resolves and renders; the coupled multi-organ model itself is future work."

biological_summary: |
  glucose-regulation's live run compared single-organ SBML models
  (Bulik2016 hepatic glucose metabolism; Topp/Silber/Sturis/Tolic
  pancreatic beta-cell/insulin-glucose models) independently, each treating
  its organ in isolation. Real glucose homeostasis, however, is a coupled
  liver-pancreas-periphery circuit: the pancreas senses blood glucose and
  secretes insulin/glucagon, the liver reads those hormones to switch
  between glycogen synthesis and glycogenolysis/gluconeogenesis, and
  peripheral tissue (muscle/fat) absorbs glucose under insulin's influence.
  The M4/Herrgårdh model (Herrgårdh2021Glucose, already cited in this
  investigation's references) explicitly represents this coupling as a
  single multi-compartment ODE system. Importing it is the natural
  "Aim 2" multiscale demonstration this investigation has been building
  toward: moving from independently-run single-organ SBML comparisons to
  one coupled model whose organ-level fluxes can be cross-checked against
  the single-organ models already in hand.

