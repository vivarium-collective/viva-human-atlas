schema_version: 4
name: hra-atlas-browser
investigation: hra-3d
title: "HRA Atlas Browser — organ selector + model-count gradient + subregion placement"
created: '2026-08-01'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Can we present the full HRA-3D model-coverage picture as an interactive
  atlas — pick any of the 50 GLB-backed HRA organs, see it colored by how many
  mechanistic models are associated with it, browse straight to those
  BioModels — AND go one level deeper, placing models at the specific organ
  SUBREGIONS (anatomical structures) their cell types / FTUs resolve to,
  rather than distributing every model uniformly across the whole organ?

study_card:
  goal: "Build the atlas manifest from the BioModels->HRA map DB (the biomodel-hra-map study's reusable JSON) and, driving UP from each model's cell types + FTUs, place models at the specific organ subregions they belong to — falling back to the whole organ where no subregion resolves — then render it as a self-contained three.js organ browser where modeled subregions are colored and hoverable individually."
  mechanism: "AtlasBrowserStep -> atlas_pack.build_and_write_atlas: organ->models from biomodel_hra_map.json (organ Uberon -> [ids]); atlas_subregions.place_models resolves subregions two ways — (1) ANATOMY: a Uberon the model itself carries (its FTU or ontology Uberons) that maps to a specific GLB mesh in the ASCT+B-3D crosswalk (datasets/hra_asctb_crosswalk.csv), placed under whichever organ's GLB contains that mesh; (2) cell-type ENRICHMENT: a model's cell type places it at an anatomical structure only where it is over-represented (>1.25x) vs the organ average in HRApop's per-AS cell populations (hra_pop.load_hrapop_as). Meshes are filtered to the organ by crosswalk organ_glb, and whole-organ-equivalent 'subregions' (label == organ) are skipped. build_atlas_manifest attaches per-organ `subregions` (node_names + Uberon + model list); the three.js viewer colors modeled subregions on a warm ramp over the organ's viridis base, with per-structure hover + click-to-list, and loads ALL same-sex GLBs per organ (so bilateral organs like kidney show both sides)."
  expected_result: "All 50 organs selectable; 14 modeled organs colored by count (blood 51 brightest); 4 organs additionally resolve 6 subregions — brain -> hippocampal formation (4) + olfactory bulb (1) (model anatomy), kidney -> outer cortex (all 5 kidney models, cell-type enriched), lymph node -> follicle (3, FTU anatomy), intestine -> caecum (1) + transverse colon (1) — with the rest of every organ (and all other modeled organs) falling back to the whole-organ color."
  main_expert_question: "Given HRApop's coarse anatomical-structure granularity and that most FTUs (islet, glomerulus, lobule) have no 3D-crosswalk mesh, is anatomy-annotation + enrichment-gated within-organ placement the right honest default (few, specific subregions; whole-organ fallback), or should we trade specificity for coverage (lower enrichment / cross-organ cell-type placement) to light up more structures?"

biological_summary: |
  Mechanistic models cluster on a handful of organs (blood, pancreas, liver,
  brain, intestine, heart) and leave most of the body's 3D anatomy unmodeled;
  and within a modeled organ, most models describe organ-wide biochemistry, not
  a specific sub-structure. This Atlas Browser makes both legible. It is now
  generated from the BioModels->HRA map DB (the biomodel-hra-map study's
  reusable JSON) rather than the older name/annotation catalogs, giving 172
  distinct models across 14 organs. On top of the organ-level count gradient,
  it places models at specific anatomical structures wherever the data
  supports it, two ways: (1) anatomy the model itself carries — an FTU or
  ontology Uberon that maps to a specific GLB mesh in the ASCT+B crosswalk;
  (2) a cell type placed at an anatomical structure only where HRApop measures
  it enriched above the organ average. That resolves 14 models onto 6
  subregions in 4 organs — brain hippocampal formation (4) + olfactory bulb (1),
  kidney outer cortex (all 5 kidney models, cell-type enriched), lymph-node
  follicle (3, via the follicle FTU), and colon caecum (1) + transverse colon
  (1) — colored on a warm ramp so a modeled structure pops out of its organ.
  Everything else falls back to the whole organ, which is the honest majority:
  HRApop's anatomical structures are coarse (gross regions, not FTUs), and most
  curated FTUs (islet, glomerulus, lobule, alveolus) have no 3D-crosswalk mesh
  to color — so pancreas and liver, though heavily modeled, stay whole-organ.
  The machinery is general: as HRApop coverage, the 3D crosswalk, or per-model
  annotation improve, more subregions light up automatically.

readouts:
  - "atlas manifest: n_organs (50), n_modeled (14), n_models_distinct (172), n_models_total (236), max_models (51), n_subregions (6), n_organs_with_subregions (4)"
  - "placement stats: n_subregion_models (14), n_anatomy_models (8), n_cell_type_models (6)"
  - "per-organ n_models + BioModels list; per-organ `subregions` (node_names, Uberon, per-structure model list with placement `via`: anatomy | cell_type)"

report:
  title: "HRA Atlas Browser — 14/50 organs modeled, 14 models resolved to 6 organ subregions"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    Present HRA-3D model coverage as an interactive organ browser, and place
    models at specific organ subregions (driven by their anatomy annotations +
    cell types) where the data resolves them, falling back to the whole organ.
  conclusion: |
    The atlas manifest covers all 50 GLB-backed HRA organs; 14 carry >=1
    model (blood 51, pancreas 47, liver 46, brain 28, intestine 18, heart 10,
    adipose 6, lung 6, kidney 5, skin 5, spleen 5, ovary 4, lymph node 3,
    urinary bladder 2), now sourced from the BioModels->HRA map DB (172
    distinct models). Subregion placement resolves 14 models onto 6 anatomical
    structures in 4 organs: brain -> hippocampal formation (4) + olfactory bulb
    (1) (from the models' own anatomy annotations), kidney -> outer cortex of
    kidney (all 5 kidney models, cell-type-enriched), lymph node -> lymph node
    follicle (3, via the follicle FTU), intestine -> caecum (1) + transverse
    colon (1). Each modeled subregion is colored on a warm ramp over the organ's
    viridis base and lists its own models on hover/click; bilateral organs load
    both sides (kidney L+R). All other models — including every model in the
    heavily modeled pancreas, liver, and blood — fall back to the whole organ,
    the honest majority given the data.
  caveat: |
    Subregion resolution is real but modest (14 models, 4 organs) and bounded by
    the data, not the method: HRApop's anatomical structures are coarse gross
    regions (so a cell type rarely enriches in exactly one), and most curated
    FTUs (pancreatic islet, glomerulus, liver lobule, lung alveolus) have NO 3D
    mesh in the ASCT+B crosswalk to color, so the strongest models (pancreas,
    liver) stay whole-organ. Placement is enrichment-gated and, by default,
    within the model's tagged organ(s): cross-organ cell-type placement is
    available but off, because the mostly-generic cell types models carry (from
    the MeSH crosswalk) would otherwise smear many models onto whichever organ
    has the most anatomical structures.

embed_visualizations: []

baseline:
  - name: baseline
    step: local:viva_human_atlas.atlas_browser.AtlasBrowserStep
    params:
      db_path: "datasets/biomodel_hra_map.json"
      enrichment: 1.25
      cross_organ_max: 0

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: passed
  prerequisites:
    - study: biomodel-hra-map
      relation: leads-to
    - study: annotation-recall-gain
      relation: leads-to

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The atlas manifest enumerates all 50 GLB-backed HRA organs and colors
      the 14 modeled ones by model count (blood 51 max, 172 distinct models),
      now generated from the reusable BioModels->HRA map DB rather than the
      older name/annotation catalogs — a whole-atlas overview of where
      mechanistic modeling exists, each organ linking to its BioModels.
    evidence:
      summary: "50 organs, 14 modeled (172 distinct / 236 total), max_models=51 (blood); 36 organs greyed. Source: biomodel_hra_map.json organ->models."
  - id: F-02
    tier: measurement
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Driving placement up from the models' own anatomy annotations + cell
      types resolves 14 models onto 6 organ subregions in 4 organs — brain
      hippocampal formation (4) + olfactory bulb (1), kidney outer cortex (5,
      cell-type enriched), lymph node follicle (3), intestine caecum (1) +
      transverse colon (1) — replacing uniform within-organ distribution with
      per-anatomical-structure coloring where the data supports it, and falling
      back to the whole organ elsewhere.
    evidence:
      summary: "place_models: n_subregion_models=14 (n_anatomy_models=8, n_cell_type_models=6), 6 subregions in 4 organs. Anatomy path: a model Uberon (FTU or ontology) mapping to a crosswalk GLB mesh (brain hippocampal formation, lymph node follicle Yao_follicles). Cell-type path: kidney models' cell types enrich in the outer cortex (E>1.25 vs organ average)."

limitations:
  - "Subregion resolution is bounded by HRApop's coarse anatomical-structure granularity (gross regions, not FTUs) — most cell types are spread evenly across an organ's structures and enrich in none, so their models correctly fall back to the whole organ."
  - "Most curated FTUs (pancreatic islet UBERON:0000006, glomerulus, liver lobule, lung alveolus) have NO mesh in the ASCT+B-3D crosswalk, so FTU-direct placement fires only for FTUs that do (lymph node follicle) — the heavily modeled pancreas/liver stay whole-organ despite carrying an FTU."
  - "Cross-organ cell-type placement is off by default: the mostly-generic cell types models carry (from the MeSH crosswalk) are not specific enough to place a model into an organ it isn't tagged to without smearing many models onto the most-subdivided organs (colon, lung)."

discovery_implications:
  resolved_uncertainties:
    - "The Atlas Browser can be generated directly from the reusable BioModels->HRA map DB (biomodel-hra-map) and can place models at specific organ subregions driven by their cell types / FTUs, not just at whole organs — realizing the fp-as-level-coverage follow-up."
    - "Where the data supports it (kidney cortex, lymph-node follicle, colon), per-anatomical-structure coloring replaces uniform within-organ distribution; where it does not, whole-organ fallback is the honest and correct behavior."
  remaining_uncertainties:
    - "Would a committed HRApop-derived per-AS index at finer granularity (or an FTU->AS mesh crosswalk covering islet/glomerulus/lobule) resolve the heavily modeled pancreas/liver into subregions?"
    - "Can a stricter, cell-type-specificity-aware cross-organ gate light up multi-organ placement for genuinely cell-type-defined models without the generic-cell-type smear?"
  followup_study_proposals:
    - id: fp-ftu-mesh-crosswalk
      title: "An FTU -> 3D-mesh crosswalk so islet/glomerulus/lobule models place at their FTU"
      motivation: "The strongest subregion signal (a model's FTU) can't be shown for pancreas/liver/kidney-nephron because those FTUs have no ASCT+B-3D mesh — an FTU->representative-mesh mapping would place the largest modeled organs' models at their functional units."
      study_type: method-upgrade
      proposed_experiment: "Build/curate an FTU-Uberon -> GLB-node crosswalk (e.g. islet -> a pancreas-body region, glomerulus -> renal cortex), and place FTU models onto those meshes; measure the subregion coverage gain."
      expected_information_gain: high
      source_trigger: hra-atlas-browser
    - id: fp-specificity-cross-organ
      title: "Cell-type-specificity-gated cross-organ placement"
      motivation: "A model defined by a specific cell type legitimately maps to several organs; the current generic-cell-type signal smears, so cross-organ is off. A specificity score (how few organs a cell type occurs in) could re-enable it safely."
      study_type: method-upgrade
      proposed_experiment: "Weight each cell type by its cross-organ specificity in HRApop, and admit cross-organ placement only for models whose cell types are specific; compare against the within-organ-only default."
      expected_information_gain: medium
      source_trigger: hra-atlas-browser
