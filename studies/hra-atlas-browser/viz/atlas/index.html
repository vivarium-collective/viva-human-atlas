<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HRA Atlas Browser — organs by model coverage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg:#0e1116; --panel:#161b22; --text:#d6dde3; --text-dim:#8a96a3;
      --border:#2a313c; --nomodel:#5a616b; --accent:#4caf78;
      --menu-w:320px;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;overflow:hidden;}
    #app{position:relative;width:100vw;height:100vh;}
    canvas{display:block;width:100%;height:100%;}
    header{position:absolute;top:0;left:0;right:0;z-index:20;background:var(--panel);
      border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:14px;}
    header h1{font-size:14px;font-weight:600;margin:0;}
    header h1 .sub{color:var(--text-dim);font-weight:400;font-size:12px;margin-left:8px;}
    #summary-line{color:var(--text-dim);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums;}
    .card{position:absolute;background:var(--panel);border:1px solid var(--border);
      border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);}

    /* ---- left organ menu ---- */
    #organ-menu{top:52px;left:12px;bottom:12px;width:var(--menu-w);
      display:flex;flex-direction:column;overflow:hidden;}
    #organ-search{margin:10px 10px 6px;padding:6px 9px;background:var(--bg);color:var(--text);
      border:1px solid var(--border);border-radius:6px;font-size:12px;}
    #organ-search::placeholder{color:var(--text-dim);}
    #menu-controls{display:flex;align-items:center;gap:6px;padding:0 10px 8px;
      border-bottom:1px solid var(--border);}
    #menu-controls button{background:var(--bg);color:var(--text);border:1px solid var(--border);
      border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;}
    #menu-controls button:hover{border-color:var(--accent);}
    #menu-controls .count{margin-left:auto;color:var(--text-dim);font-size:11px;
      font-variant-numeric:tabular-nums;}
    #organ-list{flex:1;overflow-y:auto;padding:2px 0;}

    /* ---- system group headers ---- */
    .group-head{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;
      background:rgba(255,255,255,.02);border-top:1px solid var(--border);
      font-size:11.5px;font-weight:600;letter-spacing:.02em;user-select:none;}
    .group-head:hover{background:var(--bg);}
    .group-head .caret{width:10px;color:var(--text-dim);font-size:10px;transition:transform .12s;}
    .organ-group.collapsed .caret{transform:rotate(-90deg);}
    .organ-group.collapsed .group-body{display:none;}
    .group-head .gchk{width:13px;height:13px;flex-shrink:0;border:1px solid var(--border);
      border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);}
    .group-head .gchk.on{background:var(--accent);border-color:var(--accent);}
    .group-head .gchk.partial{background:#2f6f4f;border-color:#2f6f4f;color:var(--text);}
    .group-head .gname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .group-head .gcount{color:var(--text-dim);font-weight:400;font-size:10.5px;
      font-variant-numeric:tabular-nums;}
    .group-head .gonly{color:var(--text-dim);font-weight:400;font-size:10.5px;
      border:1px solid var(--border);border-radius:5px;padding:1px 6px;visibility:hidden;}
    .group-head:hover .gonly{visibility:visible;}
    .group-head .gonly:hover{border-color:var(--accent);color:var(--text);}
    .organ-row{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 22px;cursor:pointer;
      border-left:3px solid transparent;}
    .organ-row:hover{background:var(--bg);}
    .organ-row.selected{background:var(--bg);border-left-color:var(--accent);}
    .organ-row .chk{width:13px;height:13px;flex-shrink:0;border:1px solid var(--border);
      border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);}
    .organ-row.selected .chk{background:var(--accent);border-color:var(--accent);}
    .organ-row .sw{width:11px;height:11px;border-radius:50%;flex-shrink:0;
      border:1px solid rgba(255,255,255,.18);}
    .organ-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .organ-row.zero .nm{color:var(--text-dim);}
    .organ-row .ct{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;flex-shrink:0;}
    .organ-row .only{flex-shrink:0;color:var(--text-dim);font-size:10.5px;border:1px solid var(--border);
      border-radius:5px;padding:1px 6px;visibility:hidden;}
    .organ-row:hover .only{visibility:visible;}
    .organ-row .only:hover{border-color:var(--accent);color:var(--text);}

    #legend{border-top:1px solid var(--border);padding:9px 12px;font-size:11.5px;}
    #legend .bar{height:9px;width:100%;border-radius:5px;margin:5px 0;
      background:linear-gradient(90deg,#440154,#472c7a,#3b518b,#2c718e,#21908d,#27ad81,#5cc863,#aadc32,#fde725);}
    #legend .scale{display:flex;justify-content:space-between;color:var(--text-dim);}
    #legend .nomodel-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
    #legend .swatch{width:11px;height:11px;border-radius:50%;background:var(--nomodel);
      border:1px solid rgba(255,255,255,.15);}

    /* ---- right BioModels panel ---- */
    #biomodels-panel{top:52px;right:12px;width:300px;max-height:calc(100% - 76px);
      display:flex;flex-direction:column;overflow:hidden;}
    #biomodels-panel .bp-head{padding:10px 14px;border-bottom:1px solid var(--border);}
    #biomodels-panel .bp-title{font-weight:600;font-size:13px;}
    #biomodels-panel .bp-sub{color:var(--text-dim);font-size:11.5px;margin-top:2px;}
    #biomodels-list{overflow-y:auto;padding:6px 0;}
    #biomodels-list a{display:block;padding:6px 14px;color:var(--text);text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,.04);}
    #biomodels-list a:hover{background:var(--bg);}
    #biomodels-list .mid{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;}
    #biomodels-list .empty{padding:10px 14px;color:var(--text-dim);}
    #status{position:absolute;bottom:14px;left:calc(var(--menu-w) + 28px);z-index:20;
      color:var(--text-dim);font-size:11.5px;}
  </style>
  <script type="importmap">
  {"imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="app">
    <header>
      <h1>HRA Atlas Browser<span class="sub">organs by model coverage</span></h1>
      <div id="summary-line">loading…</div>
    </header>

    <aside id="organ-menu" class="card">
      <input id="organ-search" type="search" placeholder="Filter organs…" aria-label="Filter organs">
      <div id="menu-controls">
        <button id="btn-all-modeled" type="button" title="Show all organs that have >=1 model">All modeled</button>
        <button id="btn-all" type="button" title="Show all 50 organs (heavier)">All</button>
        <button id="btn-none" type="button" title="Clear selection">None</button>
        <span class="count" id="sel-count"></span>
      </div>
      <div id="organ-list"></div>
      <div id="legend">
        <div>models per organ</div>
        <div class="bar"></div>
        <div class="scale"><span>1</span><span id="legend-max">—</span></div>
        <div class="nomodel-row"><span class="swatch"></span><span>no model</span></div>
      </div>
    </aside>

    <div id="biomodels-panel" class="card">
      <div class="bp-head">
        <div class="bp-title" id="bp-title">Select an organ</div>
        <div class="bp-sub" id="bp-sub"></div>
      </div>
      <div id="biomodels-list"></div>
    </div>

    <div id="status">loading…</div>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
