schema_version: 4
name: spatial-linkage
investigation: hra-3d
title: "Spatial Linkage — Model -> AS -> GLB Scene-Node Links"
created: '2026-07-26'
status: running
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  For each biomodel-DO organ annotation, exactly which ASCT+B-3D crosswalk
  GLB scene node(s) does it correspond to — precise enough for a 3D viewer
  to color/label the right node per model?

study_card:
  goal: "Join biomodel-DO organ annotations to crosswalk anatomical-structure nodes on shared Uberon CURIE, and confirm the composite loads a non-empty per-link list plus summary counts."
  mechanism: "SpatialLinkStep.update -> build_spatial_links(query, max_results) = build_biomodel_do_catalog(...) organs joined against fetch_crosswalk(...) rows sharing the same Uberon -> links + spatial_link_summary -> RAMEmitter."
  expected_result: "At least one (biomodel, crosswalk AS node) link, each carrying the exact `node_name` a viewer should color; `readout` is a placeholder string in v1 (no simulation output wired yet)."
  main_expert_question: "Is Uberon-CURIE-only join precise enough (a model's organ can link to multiple GLB nodes cut from the same reference-organ GLB), or does a real viewer need a single 'best' node resolved per model?"

biological_summary: |
  Marking an organ "covered" is a coarse signal; a 3D viewer needs to know
  exactly which GLB scene node to color for a given model. This study joins
  each biomodel-DO organ annotation directly to the crosswalk rows sharing
  its Uberon CURIE, producing the (model, GLB node) pairs a viewer renders
  against. Because HRA ships separate male/female reference-organ GLBs, one
  organ annotation legitimately links to two nodes (one per sex) — the join
  is deliberately Uberon-only in v1, deferring "pick the single best node"
  resolution to a future viewer-side step.

readouts:
  - "spatial_link_summary.n_links / n_models"
  - "per-link node_name (the GLB scene node a model's organ maps to)"

report:
  title: "Spatial Linkage — 10 model->AS->node links across 5 models, liver + pancreas"
  verdict: passing-with-caveats
  confidence: high
  evidence_quality: measured
  objective: |
    For each glucose-regulation biomodel-DO organ annotation, which
    ASCT+B-3D crosswalk GLB scene node(s) does it join to, precisely enough
    for a 3D viewer to color the right node per model?
  conclusion: |
    The live join produces 10 links across 5 distinct biomodels (25-result
    "glucose regulation" query): BIOMD0000000633 (Bulik2016 hepatic glucose
    metabolism) -> VH_F_liver/VH_M_liver; MODEL2001080002 (Topp2000 b-cell
    mass/insulin/glucose), MODEL1112110004 (Silber2007 IV glucose), and
    BIOMD0000000382 (Sturis1991 ultradian oscillations) and
    BIOMD0000000372 (Tolic2000 insulin-glucose feedback) each ->
    VH_F_pancreas/VH_M_pancreas. Every model links to exactly 2 nodes (one
    per sex), confirming the Uberon-only join fires correctly and is fully
    reproducible from the shared organ Uberon.
  caveat: |
    `readout` is a literal placeholder string (`"pending time-series"`) in
    v1 for every link — no simulation output is wired to a node yet, so
    this study demonstrates the join topology only, not a live-data 3D
    viewer. The 2-links-per-model pattern (one per sex) also means a
    viewer must still resolve "which sex's GLB is currently displayed" to
    color a single node, not both.

baseline:
  - name: baseline
    composite: viva_human_atlas.composites.spatial_link_composite.spatial-linkage
    params:
      query: "glucose regulation"
      max_results: 25

embed_visualizations:
  - name: "Model->AS links per organ"
    url: "/reports/figures/spatial-linkage/links-per-organ.html"
    description: "Bar chart of (model, GLB-node) link counts per organ label from the live join: 10 links / 5 models, all liver or pancreas."

runs:
  - name: baseline
    status: completed

pipeline_gate:
  gate_evaluator:
    result: needs_calibration

findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The live Uberon-only join produces 10 (model, GLB-node) links across
      5 distinct biomodels, with every model linking to exactly 2 nodes
      (one per sex) -- confirming the join mechanism is deterministic and
      reproducible from the shared organ Uberon, even though `readout` is
      still a literal placeholder string ("pending time-series") for every
      link in v1.
    evidence:
      summary: "10 links across 5 models (BIOMD0000000633 -> liver x2; MODEL2001080002, MODEL1112110004, BIOMD0000000382, BIOMD0000000372 -> pancreas x2 each); 2 links per model, one per sex."

conclusion_verdicts:
  regression_compatibility:
    basis: "The baseline spatial-link join composite (biomodel-DO organs x crosswalk rows on shared Uberon) completed without error."
  biological_validation:
    basis: "The join topology is verified correct (every model links to exactly 2 sex-split nodes), but `readout` is a placeholder string for every link -- no simulation result is actually linked to a node yet, so this is gated needs_calibration rather than passed."
  explanatory_gain:
    basis: "F-01 establishes the join mechanism works reliably (10 links/5 models, Uberon-only, fully reproducible) but carries no result data yet -- model->AS->node linkage works at the topology level only."

limitations:
  - "`readout` is a literal placeholder string ('pending time-series') for every link in v1; no simulation output is wired to a node yet."
  - "The 2-links-per-model pattern (one per sex) means a viewer must still resolve 'which sex's GLB is currently displayed' to color a single node, not both."

discovery_implications:
  resolved_uncertainties:
    - "Uberon-only join reliably produces exactly 2 links per model (one per sex), confirming the join mechanism is deterministic and reproducible."
  remaining_uncertainties:
    - "Can we spatially link model RESULTS (steady-state values), not just organ presence, to a specific AS node?"
    - "Is Uberon-CURIE-only join precise enough, or does a real viewer need a single 'best' node resolved per model?"
  followup_study_proposals:
    - id: fp-result-driven-spatial-link
      title: "Result-driven spatial linkage"
      motivation: "Color AS nodes by a real model readout (steady-state concentration from the corpus dataset) instead of a placeholder string, so the 3D viewer shows results, not just coverage."
      study_type: data-pipeline
      proposed_experiment: "Extract steady-state species concentrations from the committed corpus COPASI/Tellurium comparison dataset and attach them as the `readout` field on each (model, AS-node) link, replacing the placeholder 'pending time-series' string; re-render the 3D viewer pack colored by that value."
      expected_information_gain: high
      source_trigger: spatial-linkage
