findings:
  - id: F-01
    tier: interpretation
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      The full atlas build is a single connected process-bigraph composite:
      ModelHarvestStep and AsctbTablesStep feed GeneEnrichStep and
      HRApopEnrichStep, which feed ComputationalModelAtlas, wired through the
      model->HRA map DB as the shared artifact. Every stage — including the two
      enrichment stages and the BTO->Uberon crosswalk that were previously loose
      scripts — is now a first-class Step visible and connectable in the modules
      tab / Composite Explorer.
    evidence:
      summary: "5 Steps wired via per-stage stores (db_harvested, asctb_path, db_gene, db_hrapop); enrich/crosswalk stages promoted from scripts to Steps sharing their core with the CLIs (cannot diverge). Composite spec id: viva_human_atlas.composites.atlas_pipeline.hra-atlas-pipeline."
  - id: F-02
    tier: measurement
    mechanism_origin: engineered
    claim_scope: mechanism
    statement: |
      Run offline, the pipeline reproducibly regenerates the committed
      atlas.json: it reproduces the committed atlas readouts exactly (50 organs,
      24 modeled, 689 distinct models, 52 subregions in 9 organs), and two
      offline runs produce byte-identical atlas.json. The committed datasets are
      the frozen snapshot; live=true re-harvests from the source APIs.
    evidence:
      summary: "tests/test_atlas_pipeline_composite.py asserts regenerated readouts == committed readouts (no hardcoded numbers); tests/test_atlas_pipeline_reproducible.py asserts two offline runs are byte-identical. Verified independently: build_and_write_atlas from the committed DB is byte-identical to the committed atlas.json."

limitations:
  - "Reproducibility is offline-replay of the committed datasets; a live re-harvest (live=true) drifts with the upstream BioModels/Physiome/PhysioNet repositories, HRA services, UniProt/ENA, and the LLM literature extraction, and is not bit-identical run-to-run."
  - "This study adds no new biological findings; the subregion-placement science and coverage numbers are inherited from the hra-atlas-browser study."
