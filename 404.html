<!doctype html>
<meta charset="utf-8">
<title>Redirecting… — viva-human-atlas</title>
<meta name="robots" content="noindex">
<!--
  Back-compat redirect. The read-only site was renamed from /dashboard/ to
  /workbench/. GitHub Pages serves this 404.html for any path it can't find, so
  old deep links under /viva-human-atlas/dashboard/… are forwarded here to the
  matching /viva-human-atlas/workbench/… path (sub-path, query, and hash kept).
  Any other unknown path falls through to the workbench home.
-->
<script>
(function () {
  var OLD = "/viva-human-atlas/dashboard/";
  var NEW = "/viva-human-atlas/workbench/";
  var path = location.pathname;
  if (path.indexOf(OLD) === 0) {
    location.replace(NEW + path.slice(OLD.length) + location.search + location.hash);
  } else {
    location.replace(NEW);
  }
})();
</script>
<p>Redirecting to the <a href="/viva-human-atlas/workbench/">viva-human-atlas read-only workbench</a>…</p>
